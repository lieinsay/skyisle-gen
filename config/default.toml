# ============================================================
# 行星地形与文明生成器 · 默认配置
# 所有数值可调；[skeleton] 是 docs/11 定稿骨架的结构参数（D/G/中心窗共用一份）。
# 通过率矩阵的默认值 = docs/11 第六节全局障碍表（结构性占位，按第二层校准）。
# ============================================================

[run]
# id = "my-run"        # 缺省为 seed<N>

[shared]
day_range_km = 500.0   # 1 天 = 中性风因子下的航程
grid_res_deg = 1.0

[shared.ships]         # 地形分类阈值与航程共用一组（docs/02 第三节：分类即能力阈值）
# 节点 = 岛群（R10）：阈值量的是「岛群之间」的间距；群内小岛彼此 5–15 km，永远是密接
# （半小时可达），属第三层，不进管线。
bridge_days = 0.15     # 密接群岛：群与群之间可架索桥、短渡
small_days = 1.0       # 中疏诸岛：群间小船单日可达；也是「宽空域」起算宽度
big_days = 3.0         # 稀疏岛链：群间需好船；大船最大单跳航程

[shared.scale]         # 尺度口径（BACKLOG 第一批拍板；三者自洽 → 25M × 0.10 × 100 = 2.5 亿人 = 公元 1 年全球）
total_land_km2 = 25000000.0   # P3 全世界陆地总量；③ 据此反解陆地占比基线 f0
arable_frac_mean = 0.10       # P2 可用地率均值（日本 11.4%：多山火山岛国）；③ 每群抽一个 arable_frac
people_per_arable_km2 = 100.0 # P1 人口密度（汉代垦田口径 113）。①–⑧ 只用于摘要与九格表量词；⑨ 政治层据此出人口场（第四批 R7）

[skeleton]
d_lon_west = -30.0            # 中央宽空域 D 的经度范围（①② 之间，≈中亚）
d_lon_east = 10.0
d_density_mult = 0.05
eq_core_halfwidth_deg = 6.0   # 赤道永暴带无岛核心（障碍 A 的几何）
g_delta_deg = 6.0             # G 纬度 = 信风/无风带剪切纬度 − δ（决策 3：由剪切边界派生）。第三批改 5 → 6（G 22°N）：新降水模型下文明中心落在 14–18°N，δ=5 时主干线从 G 南侧直过、G 不挡路，seed 7 的 P6 挂；δ=6 三 seed 全过（δ=7 时 P4 的共享使节条件翻转，别用）
g_radius_deg = 4.0            # G 绝对阻断半径
detour_arc_gap_deg = 2.0      # 绕道岛弧半径 = R_G + gap；弧上两侧弦长必须 ≤ 大船航程，
                              # 「若无 G 本可直穿」才成立，G 的改道才是真实的（验收 6 的反事实）
detour_arc_halfwidth_deg = 1.5
detour_arc_boost = 4.0        # 弧上密度倍增（仍远低于带基线）。别调到 8：D 对日常往来也通了，P4 在 seed 42/7 上挂
center_window_deg = 40.0      # 文明中心窗宽（缺省 = D 宽）

# ---------------- ① 行星 ----------------
[s01.planet]
rotation_period_hr = 24.0
axial_tilt_deg = 20.0
insolation_rel = 1.0
radius_km = 6371.0
held_hou_scaling = false      # true：带界随自转率缩放（快转→窄哈德莱圈）

# ---------------- ② 大气环流 ----------------
[s02.wind]
eq_storm_top_deg = 8.0        # 赤道永暴带（风系）半宽
trades_top_deg = 28.0
calm_top_deg = 36.0
westerlies_top_deg = 62.0
trade_speed = 8.0             # m/s
westerly_speed = 11.0
polar_speed = 4.0
hadley_inflow_speed = 2.0     # 信风带的向赤道分量（哈德莱环流表层）
ferrel_outflow_speed = 1.5    # 西风带的向极分量（费雷尔环流表层）→ 副热带辐散（干）、中纬辐合（湿）；④ 水汽模型的雨带来源
polar_outflow_speed = 1.0     # 极地东风的向赤道分量（极地环流表层）→ 极区辐散（干）
g_vortex_speed = 25.0         # G 气旋切向峰速

# ---------------- ③ 岛屿分布 ----------------
[s03.islands]
n_islands = 8000
knn_k = 6
n_far = 3                     # 每节点额外远程候选边（≤ big_days）
noise_base_cells = 8
noise_octaves = 5
noise_persistence = 0.55
noise_gamma = 1.5             # 残余纹理：密度 = 带基线 × 板块乘子 × exp(gamma × noise)（板块接管大格局后调小，原 3.0）
# 陆地（R8/R10）：节点 = 岛群，area_km2 = 群的总陆地 = 集雨面 = 人口容量 = 政治体量
# （docs/02 §六/§七），不是装饰字段。建模为「势力范围 × 陆地占比」而非绝对面积：
#   势力范围 T = 0.866 × (群间平均间距)²（六边形填充；间距 = mean_nn，与分类共用）
#   陆地占比 f = min(f_cap, f0 × (局部密度/中位密度)^α × 对数正态抖动)
#   陆地 area = T × f；f0 由 Σarea = shared.scale.total_land_km2 反解（二分）
# 几何自洽由构造保证（陆地 ≤ 0.35 势力范围）。f 与密度正相关（现实群岛如此：印尼 0.35、
# 菲律宾 0.19、加勒比 0.09、巴哈马 0.02、夏威夷 0.01）。
land_frac_alpha = 1.0         # f ∝ 密度^α。α=1：势力范围 ∝ 1/密度，于是未封顶的群陆地大致相等
                              # （「一个邑就是一个邑」），四个地形类的 f 恰好落到四个现实锚点；
                              # α=0：f 全局常数，稀疏区群陆地会是密接区的百余倍（荒谬）
land_frac_cap = 0.35          # f 硬上限（印尼水平）；密接群岛整体贴顶
land_frac_sigma = 0.5         # f 的对数正态抖动（群与群之间的陆地差异；抖动后仍封顶）
# 可用地率（R9）：陆地里能耕的比例。只是一个标量，不生成岛内地形（第三层按需生成）。
arable_frac_sigma = 0.35      # 对数正态抖动（均值 = shared.scale.arable_frac_mean）
arable_frac_range = [0.03, 0.30]  # 夹断：火山岩岛 ~0.03，冲积平坦岛群 ~0.30
height_scale_m = 1500.0
height_noise_cells = 5
height_jitter_m = 150.0
stack_zone_threshold = 0.9    # 叠层岛区：汇聚边界核（[s03.plates]）超过此值的碰撞带，高度呈双层分布（第三批 2 起不再用独立噪声）
stack_range_m = 1200.0
layered_height_std_m = 320.0  # 邻域高度标准差超过此值 → 叠层
# 主岛与岛体（第三批第 1 步，docs/PLAN-BATCH3.md 5.1）。群内最大的一座岛 = 主岛；河与挡风都看它。
main_frac_mean = 0.5          # 主岛占群陆地的比例（对数正态均值）；main_area = area × main_frac
main_frac_sigma = 0.4         # 对数正态抖动
main_frac_range = [0.2, 0.9]  # 夹断：碎成几十座差不多的小岛 ~0.2，一座大岛带几粒卫星岛 ~0.9
# 岛体：云带顶面 = 高度零点，岛底离云带顶一个固定间隙，岛体从底到顶是实心浮石（决定 3）。
# 墙高 wall_m = max(0, height_m − keel_clearance_m)：②b 挡风用的迎风截面高度；低于间隙的岛当薄片
keel_clearance_m = 300.0
expedition_pairs = 6          # 跨赤道远征边数
expedition_min_lon_sep_deg = 30.0

[s03.plates]                  # 浮石板块（第三批第 2 步，docs/PLAN-BATCH3.md 5.2；实现在 tectonics.py）
# docs/02 §九：浮石骨架随洋流汇聚嵌合 → 汇聚边界堆出密度脊与叠层，离散边界拉出空域，走滑错断岛链；
# 热点链是固定点拖出的线性岛链（年龄单调）。只产出静态格局，不违反原则甲。
n_plates = 28
plate_sigma = 0.35            # 各板块整体丰度的对数正态抖动（板块定大格局）
boundary_width_deg = 3.0      # 边界核宽度（高斯 σ）
p_convergent = 0.45           # 边界类型概率：汇聚 / 离散 / 其余走滑
p_divergent = 0.30
convergent_boost = 2.0        # 汇聚：密度 ×(1 + boost·核)
divergent_cut = 0.85          # 离散：密度 ×(1 − cut·核)
transform_boost = 0.8         # 走滑：密度 ×(1 + boost·核·错断调制)
transform_segment_deg = 12.0  # 走滑错断的段长
convergence_kappa = 0.3       # ② 风场辐合纹理：×exp(κ·标准化辐合)，0 = 关
n_hotspots = 4
hotspot_length_deg = 40.0
hotspot_spacing_deg = 3.0
hotspot_radius_deg = 1.5
hotspot_boost = 3.0
height_convergent_boost = 0.6 # 汇聚带抬升：高度 ×(1 + boost·核)
height_age_decay = 0.35       # 老岛下沉：高度 ×(1 − decay·age)
age_scale_deg = 30.0          # 离散边界起算的岛龄尺度（age = 距离/尺度，夹 [0,1]）

[s03.islands.band_density]    # 相对密度基线（按纬度带）
trades = 1.0
subtropical_calm = 0.35
westerlies = 0.05             # 稀疏岛链：这个世界的草原（docs/11 §四）
polar = 0.012                 # 孤悬散岛
equatorial_margin = 0.3       # 永暴带核心之外、风系带之内的边缘

# ---------------- ④ 气候 ----------------
[s04.climate]
# 河流（PLAN-BATCH3 5.5，决定 1）：主岛够大、够高、够湿的群有常年河流，按地球常见程度约六七成的群。
# has_river = main_area ≥ river_main_area_km2 且 height ≥ river_height_m 且 precip ≥ river_precip_min
# river_size = main_area × precip（集水面代理）。河默认只进九格表文本，不进人口容量：
# catch × (1 + river_capacity_bonus × river_size/中位河)，bonus = 0 即不影响任何推导
river_main_area_km2 = 300.0
river_height_m = 400.0
river_precip_min = 0.35
river_capacity_bonus = 0.0
temp_eq_c = 28.0
temp_pole_c = -18.0
lapse_c_per_km = 6.0
# 降水 = 上风水汽追踪（第三批第 4 步，moisture.py；决定 2、4）：∂q/∂t + ∇·(q u) = E − P，P = q·ε/τ。
# 雨影与赤道湿 / 副热带干 / 中纬湿 / 极地干都从扰动后的风场算出，原来手画的四个高斯项已退役。
moisture_res_deg = 2.0        # 求解网格（须为 shared.grid_res_deg 的整数倍；2° 约 3 s，1° 约 8 倍）
moisture_days = 40.0          # 推进天数（τ 的十倍即接近稳态）
moisture_tau_days = 4.0       # 水汽停留时间 τ
moisture_polar_filter_lat = 70.0  # 超过此纬度做纬向平均（CFL 极点问题）
evap_temp_coeff = 0.03        # 蒸发源 E = exp(coeff × (T − T_ref))：Clausius–Clapeyron 是 6 %/°C，但相对降水按 3 % 才不把中纬雨带压没（扫描见 DESIGN-NOTES 四点八）
evap_temp_ref_c = 15.0
precip_conv_k = 0.6           # 降水效率 ε = exp(k × 标准化辐合)：辐合抬升多雨、辐散下沉压制
precip_uplift_k = 3.0         # ε ×(1 + k × 撞墙抬升)：迎风坡多雨 → 背风雨影
precip_storm_k = 0.5          # ε ×(1 + k × 风暴)：锋面 / 风暴带多雨
precip_norm_pct = 98.0        # 归一：P 的此分位 = 1
precip_noise_amp = 0.0        # 残余纹理（0 = 全部由模型算出）
storm_eq_amp = 1.0
storm_shear_amp = 0.35
storm_shear_width_deg = 2.5
storm_midlat_amp = 0.55
storm_midlat_width_deg = 8.0
storm_g_amp = 1.0

[s04.localwind]               # ②b 岛对风的扰动（第三批第 3 步，localwind.py；决定 3：岛是从云带顶立到山顶的浮山）
boundary_layer_m = 3000.0     # 障碍场 O = gain × 墙高/此厚度 × 陆地占比 × 势力范围覆盖，夹 [0,1]
obstacle_gain = 4.0           # 增益：截面份额本身只有百分之几，乘 4 后密集群岛上空 O ≈ 0.5–0.9（一排悬空的山）
smooth_deg = 1.5              # 障碍场与陆地覆盖场的高斯抹开 σ
friction_k = 0.35             # 摩擦：风速 ×(1 − k·O)，密集群岛上空最多降三成
deflect_k = 1.0               # 绕流：速度 −= k·|U|·∇O（每度梯度）
wake_steps = 8                # 尾流：沿风向上游回溯的步数 / 步长 / 几何衰减 / 亏损系数
wake_step_deg = 1.0
wake_decay = 0.75
wake_k = 0.3
shift_window_deg = 6.0        # 带界位移 Δφ(lon)：带界 ±window 内障碍的纬向异常 → 低通到波数 ≤ kmax
shift_wavenumber_max = 4
shift_gain_deg = 2.5          # 按标准差定标到 gain 度（R11：起伏 ±2–5°，带结构仍可辨）
shift_max_deg = 3.5           # 夹断；无风带只有 8° 宽，两侧反向各 3.5° 仍不交叉（校验限 < 4）
storm_k = 0.15                # 风暴 ×(1 − k·O)：二阶小量，永暴带不能被岛打散
local_wind_max = 4.0          # 可靠局地风 v_local = max × min(1, 陆地覆盖/ref)：密集群岛的热力日循环；⑥ 无风惩罚取 max(风速, v_local)
local_land_ref = 0.3

# ---------------- ⑤ 障碍（docs/11 第六节矩阵 + 边局部因子） ----------------
[s05]
perm_min = 1e-6               # 低于此通过率的边视为该模式不存在

[s05.barriers.A]              # 赤道永暴带：吸收型。仅存极窄季节窗口，几代人一次远征
kind = "eq_core"
type = "absorbing"
seasonal = true
permeability = { daily = 0.0, trade = 0.0, envoy = 0.03, migrate = 0.0 }

[s05.barriers.B]              # 副热带无风带（北）：农耕带 ↔ 西风带的过渡
kind = "band"
band = "subtropical_calm_n"
type = "selective"
permeability = { daily = 0.1, trade = 0.5, envoy = 0.8, migrate = 0.1 }

[s05.barriers.C]              # 镜像（南）
kind = "band"
band = "subtropical_calm_s"
type = "selective"
permeability = { daily = 0.1, trade = 0.5, envoy = 0.8, migrate = 0.1 }

[s05.barriers.D]              # 中央宽空域：「文书通、口音不通」的经典范本
kind = "void"
type = "selective"
permeability = { daily = 0.05, trade = 0.6, envoy = 0.95, migrate = 0.05 }

[s05.barriers.F_N]            # 中纬风暴带（北）：季节窗口
kind = "band"
band = "westerlies_n"
type = "selective"
seasonal = true
permeability = { daily = 0.2, trade = 0.4, envoy = 0.7, migrate = 0.1 }

[s05.barriers.F_S]
kind = "band"
band = "westerlies_s"
type = "selective"
seasonal = true
permeability = { daily = 0.2, trade = 0.4, envoy = 0.7, migrate = 0.1 }

[s05.barriers.G]              # 定点永暴：改道型。绝对阻断，但只阻断一个点
kind = "disc"
type = "deflecting"
permeability = { daily = 0.0, trade = 0.0, envoy = 0.0, migrate = 0.0 }

[s05.local.gap]               # 宽阔无岛空域（局部）：P^((span − small_days)/ref_days)
ref_days = 1.0
permeability = { daily = 0.15, trade = 0.7, envoy = 0.95, migrate = 0.2 }

[s05.local.density_drop]      # 岛密度骤降：P^(|ln(ρu/ρv)| / ln ratio_ref)
ratio_ref = 4.0
permeability = { daily = 0.5, trade = 0.9, envoy = 1.0, migrate = 0.6 }

[s05.local.climb]             # 高度落差：筛「谁付得起」，不筛贵贱（原则乙）
h_thr_m = 800.0
permeability = { daily = 0.5, trade = 0.9, envoy = 0.95, migrate = 0.6 }

# [s05.political] 政治性障碍：人为、可变。默认为空。示例：
# [[s05.political.overrides]]
# lat_range = [10.0, 20.0]
# lon_range = [40.0, 50.0]
# permeability = { daily = 0.3, trade = 0.5, envoy = 1.0, migrate = 0.2 }

# ---------------- ⑥ 航线网络 ----------------
[s06.routes]
tailwind_factor = 0.6         # 顺风成本系数（dir(c) 端点）
headwind_factor = 2.0
calm_v_ref = 5.0              # m/s，低于此风速开始加「无风」惩罚
calm_kappa = 2.0
calm_max = 3.0
storm_kappa = 6.0             # 成本 ×(1 + κ·storm)
climb_kappa = 0.5             # 成本 ×(1 + κ·max(0,Δh)/1000m)（仅爬升方向）
edge_samples = 8              # 沿边大圆采样点数（取风暴最大值）
alpha = { daily = 1.0, trade = 1.0, envoy = 0.2, migrate = 0.2 }  # 风因子指数（docs/11 E 行）
betweenness_sources = 192
betweenness_c_min_days = 3.0  # 只累计不短于此的 OD
hub_top_frac = 0.02
hub_g_top_frac = 0.30         # G 邻域内取流量前 30%（岛少，须放宽才能覆盖中转岛）
g_neighborhood_radii = 2.5    # G 邻域 = 此倍数 × R_G

# ---------------- ⑦ 文明中心与史前扩散 ----------------
[s07.centers]
tau_c = 0.5                   # 窗内最大适宜度 < τ_c × 全局最大 → 报错（原则庚）
smooth_hops = 2
# 适宜度 = 降水 × 稳定 × 岛密度 × 岛群陆地规模^γ；γ=0 即完全不看面积。
# γ 取 0.5 而非 1.0：归一化 log 面积与归一化 log 岛密度的标准差都是 ≈0.13、相关 −0.21，
# γ=1 会让「面积」这个随机量与「岛密度」这个地理量等权且互相抵消，稀释中心涌现的地理结构
# （实测 seed 2026 的 P7 从 238 个拒绝点掉到 31 个、地区覆盖不达标）。见 docs/DESIGN-NOTES §四点五。
area_exponent = 0.5
origin = "north_east"         # 人类起源地：中心 id 或 "auto"
prehist_wind_exponent = 2.0   # 史前抱石而渡：风因子指数（强单向）
yr_per_day = 50.0             # 史前扩散 1 天航程 ≈ 多少年（叙事换算）
n_secondary = 12              # 无约束次级极大（供次级起源）
secondary_per_circle = 3      # 每圈保底的次级极大数（第三批：NE 圈分不到峰值时 P7 拒绝点为 0；与 s08.k_sub 配套）
secondary_per_circle_min_sep_days = 3.0  # 保底峰之间的最小间距（NE 圈按商旅成本只有 900 岛、经度 24–100°，6 天塞不下三个）
secondary_min_sep_days = 6.0

[s07.regions]
n_regions = 60                # 目标下限
max_region_islands = 250      # 超过则分裂
max_regions = 150             # 硬上限

# ---------------- ⑧ 特征场扩散 ----------------
[s08]
engine = "field"              # "mc" 为保留接口（docs/12 第七节：可选）
fast = false                  # true：每 (origin, mode) 一棵参考 λ 树（决策 1 的 C 方案）
resistance_max = 0.98         # 收敛保证 r·R < 1
fp_tol = 1e-6
fp_max_iter = 500
eps0 = 0.02                   # 槽位「本地自有」行的基础强度（原则己：处处有文化）
eps_max = 0.3                 # 高隔离处的本地行强度（反射型：孤岛文化）
iso_d0 = 3.0                  # 隔离度尺度（权重单位）
iso_thr = 0.8                 # 超过此隔离度的连通分量 → 反射型 + 本地起源特征
iso_min_component = 3
local_slots_per_component = 3 # 每个高隔离分量生成几条本地起源特征
k_sub = 3                     # 中/高阻力槽位每文明圈的次级起源数（第三批：板块世界里文明圈更大更散，2 时哨兵种子 2026 的 P7 拒绝点为 0，3 时 459）
sub_origin_delay_days = 50.0  # 次级起源的 origin_time 延迟（仅可选先到层用）
first_arrival_weight = false  # 可选「先到者优势」层，默认关（决策 2）

[s08.half_distance_days]      # λ = ln2 / d_half；每特征在区间内对数均匀抖动
daily = [5.0, 10.0]
trade = [15.0, 30.0]
envoy = [40.0, 80.0]
migrate = [30.0, 60.0]

[s08.resistance_range]        # docs/12 第三节三档
low = [0.05, 0.2]
mid = [0.3, 0.6]
high = [0.7, 0.95]

# ---------------- ⑨ 政治层（第四批 R7；实现在 stages/s09_polity.py）----------------
# 只读 ①–⑧ 的产物，不动它们。输出：人口场、诸邦（邦 = 若干邑）、采邑树、名分 / 附庸、变法之国与兼并史。
# 与 docs/02 §八「兼并极难」和铁律三「春秋战国之交」的调和：正因兼并极难，只有先完成编户齐民、榨出组织能力的那个邦才兼并得动
# —— 所以只有变法之国能兼并，其余诸邦五百年割据不动（docs/04 §一）。
[s09.polity]
precip_full = 0.5             # 人口 = P1 × 可耕地 × clip(降水 / precip_full, precip_floor, 1)：雨够（≥ 0.5）即满载；干旱处按比例折减
precip_floor = 0.25           #   折减下限（再干也不至于空）
control_radius_days = 2.2     # R0：控制力 exp(−w / R) 的基准尺度（w = 商旅成本 × 后勤倍率 + R0 × L_trade）
ship_logistics_mult = 3.0     # 群间需飞行（间距 > 索桥 bridge_days）的边，大宗后勤成本倍率：能架桥短渡的才便宜（docs/02 §三「帝国只能长在密接群岛」）
control_min = 0.2             # θ：控制力低于此即圈不进来（半径 = R × ln(1/θ) ≈ 1.6 R）
radius_pop_exponent = 0.25    # β：R_c = R0 × (核心实力 / 中位)^β；核心实力 S = 控制范围内 Σ 人口 × 控制力（聚得拢的人与粮）
capital_min_strength_frac = 1.0   # 核心实力低于中位 × 此值的邑养不起一邦，归入控制力最大的邻邦；0.5 时邦数翻倍、中位只 5 邑，1.0 时 ≈300 邦、中位 14 邑（seed 42）
radius_mult_min = 0.5         # R_c / R0 的夹断
radius_mult_max = 2.5
direct_rule_days = 0.3        # 都城直辖圈：w ≤ 此值直辖；之外最短路树的第一级子树各为一采邑（分封 = 运输成本的产物）
suzerain_radius_mult = 0.5    # 宗主（三个文明中心所建之邦）五百年割据后权力空心化：控制半径 = R0 × 此值（不随核心实力放大），王畿锁定，旧封国各自为邦，宗主只剩名分（docs/04 §一）
vassal_pop_ratio = 3.0        # 附庸：接壤之邦人口 ≥ 本邦 ρ 倍
vassal_reach = 2.5            #   且本邦都城在对方 control 半径 × 此倍数之内（威慑距离）
reform_circle = "north_east"  # 中心 ②（玩家所属文明圈，docs/11 §五）在此圈内选变法之国
reformer_capital = -1         # ≥ 0 时强制以该节点所在之邦为变法之国（-1 = 自动：都在密接、远离宗主、密接与中疏各半、人口最多）
reform_center_distance_days = 6.0   # 「远离旧礼制中心」的饱和距离（商旅天）
reform_years_ago = 80.0       # 变法距今年数
reform_duration_years = 20.0  # 变法本身用时（此后才开始兼并）
mobilization_mult = 3.0       # 编户齐民的动员量级（docs/04 §二「量级高一档」）
defender_advantage = 2.0      # 守方优势（docs/02 §八）：攻取需 动员 ≥ 守方人口 × 此值
suzerain_awe = 3.0            # 攻宗主之邦的额外顾忌（名分仍值几分）
war_years_base = 2.0          # 一场兼并战的年数 = 基数 + 系数 × (守方人口 / 本朝人口) + 系数 × 前线一跳天数
war_years_per_pop_ratio = 20.0
war_years_per_frontier_day = 1.0
active_fronts = 2             # 当前同时列出的战线 / 对峙数
stage_years = [3, 8, 15, 25, 60]   # docs/04 §四 渐进的占领：军事 <3 | 行政 <8 | 经济 <15 | 文化 <25 | 语言 <60 | 认同 ≥60（年）

# ---------------- ⑩ 输出 ----------------
[s10.output]
projection = "rect"           # rect | mollweide
center_lon = "auto"           # auto = G 经度
dpi = 130

# ---------------- 操作台（web/，R2 气象层） ----------------
# 只影响 3D 操作台与单文件导出的显示；不在任何阶段的缓存 key 里，改了不会触发重算。
# 下面的流线/填色参数是前端的初始值，面板里的滑块可以现场覆盖。
[web]
grid_fields = ["u", "v", "temp", "precip", "storm", "band", "q", "uplift", "obstacle", "wake", "plate", "age"]   # 传给前端的 1° 网格场（u/v 16 位各 ≈ 173 KB，其余 8 位各 ≈ 86 KB，12 场合计 ≈ 1.2 MB）；体积紧张时只留 u/v/temp
streamline_spacing_deg = 4.0  # 流线播种间距（°，视高 2.2 时）；拉近时按视高等比加密，拉远时稀疏
streamline_steps = 40         # 每条流线的积分步数（顺风、逆风各半，中点法）
streamline_step_deg = 0.5     # 每步弧长（°）；步数 × 步长 ≈ 流线总长
streamline_max = 1500         # 流线条数上限（保护帧率）
wind_anim_ms = 3000           # 流线虚线流动一个周期的毫秒数（earth.nullschool 式）；0 = 静止
overlay_alpha = 0.85          # 标量填色层盖在地貌贴图上的不透明度（1 = 完全遮住地貌）
overlay_contours = true       # 标量填色层是否叠加等值线（温度 5 °C、风速 4 m/s、降水/风暴 0.1）

# ---------------- 验收（docs/12 第八节） ----------------
[check]
# 1 相邻几乎相同
adj_cost_days = 1.5
adj_perm_min = 0.9
adj_median_max = 0.02
adj_p95_max = 0.05
edge_bound_a = 0.03           # 硬项：D(e) ≤ a + b·(λ_max·cost + max_m L_m)
edge_bound_b = 1.0
# 2 走远才不同
rays_per_center = 20
ray_min_days = 10.0
spearman_min = 0.8
backstep_frac_max = 0.10
# 3 同言线互不重合
iso_theta = 0.5
jaccard_mean_max = 0.25
jaccard_free_mean_max = 0.15
p3_bundle_ratio_min = 1.5     # 聚束边（b≥3）的平均障碍分 / 全体平均
bundle_spearman_min = 0.3     # 仅参考值（会被自由区互斥型同言线稀释）
lambda_ratio_distinct = 1.5
# 4 文书通、口音不通
p4_envoy_ratio = 0.5
p4_gap_min = 0.4
p4_daily_min = 0.3
p4_share_min = 0.10              # 第三批：每圈 3 个次级起源后使节槽位有 12 个变体，单个变体份额 0.1–0.18，0.15 的「共享」门槛会整体翻转（D_envoy 0.17 ≪ D_daily 0.9 却判失败）
p4_pass_frac = 0.8
# 5 单向传播
p5_centroid_frac = 0.75       # 部分次级起源的顺风向被障碍挡住（地理压过风向），0.9 过严
p5_cost_ratio = 0.6
p5_min_days = 3.0
p5_strength_ratio = 2.0       # 全体上下风对的中位数达 2 倍不对称已是强证据（跨 seed 稳定于 2.6–3.2）
# 6 改道产生贸易枢纽
p6_bal_min = 0.3              # 少数圈份额 ≥ 多数圈的三成即「缝合」（撒马尔罕也非五五开）
p6_pctile = 75.0              # 参照系：全体节点的 P75（P90 会选中整个 D 腹地，那本就是混合区）
p6_flow_drop = 0.5            # 坍缩判定：反事实中流量下降超过此比例
p6_collapse_frac = 0.25       # G 枢纽中至少这一比例因失去绕行而坍缩（门户型不坍缩是真实现象）
# 7 传到了但不要
p7_min_nodes = 20
p7_strength_low_min = 0.4     # 同源器物在当地用得好好的
p7_reach_high_min = 0.3       # 信息确实到了（daily 半衰 5–10 天 → 0.3 ≈ 12–17 天处）
p7_adopt_max = 0.4
p7_region_frac = 0.2          # 某地区 ≥ 此比例的岛是「拒绝点」→ 拒绝是地点性的
# 骨架一致性（只报警）
skeleton_tol = 0.15
# C 二维气候（第三批）：雨影 / 带界起伏 / 干旱比例 / 河流比例
c_shadow_wall_m = 1000.0      # C1 只看岛体墙高 ≥ 此值的群
c_shadow_offset_deg = 2.5     # 沿本地风向上游、下游各取样的距离
c_shadow_ratio_min = 1.15     # 迎风 / 背风降水比的中位数
c_shadow_frac_min = 0.6       # 迎风侧更湿的群占比
c_band_amp_min = 1.0          # C2 带界最大位移（°）区间
c_band_amp_max = 6.0
c_arid_min = 0.12             # C3 干旱岛（降水 < 0.3）比例区间（改前 19.3%）
c_arid_max = 0.30
c_river_min = 0.4             # C4 有河的群比例（只报告）
c_river_max = 0.85
# P8 政治层（第四批 R7）
p8_dense_ratio_min = 1.5      # 密接之都的邦 / 中疏之都的邦 的邑数中位比（三 seed 实测 2.5–3.6）
p8_n_states_min = 100         # 全世界邦数区间（「诸侯数百」；三 seed 实测 319–426）
p8_n_states_max = 1500
