# 槽位表（docs/12 第二节 TraitSlot；docs/04 第三节的特征类型示例）。
# category → (传播模式, 阻力档) 的绑定见 [categories]；
# 加载时校验：同槽位所有非本地值同模式，阻力落在档位区间。
# 值的语义为结构性占位（「结构是硬的，名字是软的」）。

[categories.artifact]      # 器物、作物、药材、农具 —— 好用就用
mode = "trade"
resistance = "low"

[categories.measure]       # 度量、货币
mode = "trade"
resistance = "low"

[categories.script]        # 文字、历法、律法、建筑形制 —— 需要国家推行
mode = "envoy"
resistance = "mid"

[categories.custom]        # 丧俗婚俗、称谓分寸、物的用法、礼序 —— 接受它等于否认自己
mode = "daily"
resistance = "high"

[categories.kinship]       # 世系、语言底层 —— 随人走
mode = "migrate"
resistance = "high"

