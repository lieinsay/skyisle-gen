# 风格的基础表（docs/PLAN-TOWN.md 第六节）：全部键的默认值与注释。内置风格在同目录下，只写与这里不同的键。
# 加载次序：base ← 风格 ← --set style.键=值。表与表逐键深合并，列表与「表的数组」整个替换。
# 单位：m、度；区间 [lo, hi] 均匀抽样。「估」= 资料里没有、按量级估的（docs/TOWN-SOURCES.md）。
# C++ 只读展平后的键（style.*），不读 TOML；模板与功能由前端整理成数组再展平。

[meta]
id = "base"
name = "基础表"
region = ""
note = "不单独用：内置风格与自定义风格都从它继承"
sources = []

# ---------------------------------------------------------------- 选址（7.2）
[site]
center_search_m = 300.0     # 村心在上游点位多远以内挑（TP-shift）
window_factor = 1.0         # 窗口放大（散居的林盘、北欧农庄要比集村大得多的地；地面只按来源坐标取，放大只是多裁一圈）
water_scale_m = 200.0       # 「近水」这一场按 exp(−离水 / 它) 衰减
edge_scale_m = 80.0         # 「近崖缘」按 exp(−离虚空 / 它)
[site.weights]              # 住宅兴趣图 = Σ 权重 × 归一化的场（负数 = 躲开）
flat = 1.0                  # 平：1 − 坡 / 可建坡上限
water = 1.0                 # 近水
dry = 1.0                   # 高燥：大尺度地势（TPI 200 m）高于四周
sun = 0.5                   # 朝阳：冬至正午的日照强度（相对平地）
farmland = -0.3             # 压田（农户舍不得在好田上盖房）
edge = -1.0                 # 近崖缘
shelter = 0.0               # 背风：冬季风上风向地势高

[ground]
max_slope_deg = 10.0        # 可建坡上限（地块里有比它陡的格就不要）
max_cut_m = 1.5             # 一栋房的台基挖 / 填深度上限（每栋按自己脚下的地面定台基）
max_terrace_m = 2.5         # 一个宅院地块里的高差上限（超过 max_cut_m 的院子做成台地：后排高、前院低）
allow_flood = false         # 漫水区能不能建（吊脚楼风格才开）

# ---------------------------------------------------------------- 村的形态（6.2）
[village]
# 形态算子与权重：每个村按权重挑一个，只在这块地能用的里挑（滨水要河、等高线要坡），一个都不能用就团块生长。
# fishbone 鱼骨街村 / organic 团块生长 / street_village 街村 / hufen 林地排村 / waterfront 滨水 / dispersed 散居 /
# green 围绿 / comb 梳式 / contour 等高线 / enclosure 围合单体
operators = {}                       # 风格必须自己给（表逐键深合并：这里写了的键会混进每个风格）
households_per_compound = [1, 1]     # 一个宅院住几户
founders = [1, 3]                    # 开基户
kin_p = 0.6                          # 一户有「父户」（同一房支）的概率，否则算外来户
[village.max_households]             # 某个算子只在户数 ≤ 它时用（列村、环村是小村）；不写 = 不限
[village.operator_names]             # 形态算子在这个风格里叫什么（出图、调试台显示；子预设就是算子，如 hufen = "林地排村"）

[street]                             # 路的宽度（m）
trunk_width_m = [4.0, 6.0]           # 出村大路
main_width_m = [5.0, 7.0]            # 主街
street_width_m = [3.0, 4.5]          # 街
lane_width_m = [2.0, 3.5]            # 巷 / 胡同
path_width_m = [1.5, 2.5]            # 田间道、小径
plot_gap_m = [0.0, 1.0]              # 相邻地块之间的空隙
setback_m = [0.0, 0.5]               # 地块离路边
max_grade = 0.12                     # 路的最大纵坡（超过就绕，之字路自然长出来）
bridge_max_m = 24.0                  # 最长的桥（过水更宽就不过）
exits = 3                            # 出村大路最多几条（朝相邻聚落 / 治所 / 泊场）

[fishbone]                           # 鱼骨 / 井字街村（华北）：主街 + 平行的街 + 垂直的巷
street_spacing_m = [50.0, 64.0]      # 平行的街的间距（一个街坊前后两排宅院）
lane_spacing_m = [40.0, 90.0]        # 巷的间距（每个街坊各自抽，不对齐，路口多成丁字）
warp_m = 3.0                         # 街的缓弯幅度
warp_wavelength_m = 300.0
extent = 1.8                         # 候选街网的范围 = extent × 预计半径
vacant_p = 0.06                      # 候选地块空着（菜园、闲地）的概率
main_cross = true                    # 过村心的那条巷是主街（十字街）
lane_extend_m = [60.0, 160.0]        # 外排的巷伸进田里成田间道
lane_extend_p = 0.4

[organic]                            # 团块生长：一户一户挨着长，巷子随门长出来
candidates = 24                      # 每户在父户 / 邻户周围试几个位置
gap_m = [0.0, 2.0]                   # 与邻户的间隙
jitter_deg = 4.0                     # 与邻户朝向的偏差
stagger_m = 1.5                      # 与左右邻户前沿（前后邻户侧边）错开多少（0 = 对齐成排）
lane_reach_m = 40.0                  # 门离现有路多远以内才考虑（再远就要修太长的巷）
main_street = true                   # 先按坡度代价修一条过村心的主街
squares = [0, 0]                     # 先占几块广场（地中海山城 1–3）
square_radius_m = [8.0, 14.0]
square_kind = "square"               # square 广场 / pond 塘（徽州的月沼）
square_name = ""
lane_clearance_m = 0.5               # 新修的巷中线离两边院墙比半巷宽多留多少（密实的山城、宗族村取小）

[street_village]                     # 街村：一条主街两边按面宽切条地（中欧街村、宿場町、瑞典列村、英格兰 toft & croft）
axis = "auto"                        # auto：有坡顺等高线、有河顺河、否则朝最要紧的出村方向 / contour / exit / across（垂直于朝阳）
sides = 2                            # 街的一边还是两边
front_w_m = [0.0, 0.0]               # 面宽（沿街）；[0, 0] = 按模板
depth_m = [0.0, 0.0]                 # 进深；[0, 0] = 按模板
face_street = true                   # 地块一律朝街（门开在临街一边）；false 按朝向链
length_factor = 1.15                 # 主街长 = 需要的面宽 × 它
branch_spacing_m = [90.0, 140.0]     # 主街排满后分出的支街间距
branch_len_m = [80.0, 160.0]
back_lane = false                    # 地块后面各一条背巷（英格兰 back lane）
back_lane_gap_m = 2.0

[hufen]                              # 林地排村（Waldhufendorf）：每户一条长地，房在条头临路，条身是自家田
frontage_m = [40.0, 100.0]           # 每户条地的临街宽（TOWN-SOURCES §10：约 100 m）
min_frontage_m = 20.0                # 窗口里的街放不下时，最窄压到这里（再窄就换分支街）
strip_len_m = [300.0, 2400.0]        # 条地往后伸多长（到窗口边、虚空、水、陡坡为止）
axis = "auto"                        # 沿溪（有河顺河）、沿等高线
strip_name = "条地"

[waterfront]                         # 滨水（江南）：以河为骨，前街后河 / 前河后街
reach_m = 80.0                       # 河离预计半径外多远以内才用滨水
min_width_m = 3.0                    # 河至少这么宽
modes = { qianjie_houhe = 0.7, qianhe_houjie = 0.3 }   # 前街后河：街在陆上、房在街与河之间；前河后街：街沿水、房在街的陆侧
row_depth_m = [10.0, 18.0]           # 前街后河时街与河之间那一排的进深
bank_m = 1.5                         # 房后到水边留多少（河埠头的平台）
steps_every = [3, 6]                 # 几户一个河埠头（水弄通到水边的石阶）
water_lane_m = [1.2, 2.0]            # 水弄宽
steps_name = "河埠头"
bridge_spacing_m = [80.0, 200.0]     # 桥距（估，按周庄）
length_factor = 1.2

[dispersed]                          # 散居：按加权泊松盘撒点，每点一户或一簇
cluster_hh = [1, 1]                  # 一个点住几户（林盘 3–5）
spacing_m = [120.0, 250.0]           # 点与点的最小间距（林盘 300–600 m；砺波 50–100 m）
cluster_radius_m = 28.0              # 一簇在点周围多大范围里摆
w_interest = 1.0                     # 撒点的评分：兴趣图
w_farmland = 0.5                     # 在田中间（林盘、散居村被自家田围着）
w_center = 0.4                       # 离村心近一点（整个窗口的尺度上）；散居得匀的（砺波）取小
grove = "none"                       # ring 环林（林盘竹林）/ windward 冬季风上风侧的屋敷林（砺波カイニョ）/ none
grove_width_m = [10.0, 25.0]
grove_name = ""

[green]                              # 围绿：路绕一块公地（中欧绿地村 Angerdorf、英格兰 village green；小村成环村 Rundling）
modes = { anger = 1.0, rundling = 0.0 }   # 户数 ≤ rundling_max_hh 时才挑 rundling
rundling_max_hh = 12
width_m = [30.0, 100.0]              # 公地宽（TOWN-SOURCES §10：30–100 m，估）
length_m = [150.0, 600.0]            # 公地长
church_on_green = true               # 教堂落在公地上（公地够宽时）
pond_on_green = true
green_name = "公地"
pond_name = "池塘"

[comb]                               # 梳式（岭南）：前沿一排塘 + 晒坪 + 祠堂，垂直于前沿开平行巷
lane_spacing_m = [12.0, 14.0]        # 巷距（估）
rows = [5, 15]                       # 一条巷两边排几进（估）
row_gap_m = [0.4, 1.2]               # 前后栋的间隙（很小）
threshing_depth_m = [18.0, 28.0]     # 前沿外的晒坪进深
pond_depth_m = [25.0, 45.0]          # 晒坪外风水塘的进深
pond_name = "风水塘"
threshing_name = "晒坪"
hall_every_hh = 25                   # 每多少户一座祠堂（前排）
halls_max = 3

[contour]                            # 等高线（窑洞、山地村）：房背靠坡、朝下坡，沿台线排，层间之字路
min_slope_deg = 8.0                  # 坡 ≥ 它的格
min_share = 0.35                     # 占村心一带这么多时才用等高线
layer_m = [3.0, 5.0]                 # 层差
max_slope_deg = 55.0                 # 比它陡的坡不挖
min_line_m = 25.0                    # 太短的台线不要

[enclosure]                          # 围合单体（客家土楼 / 围龙屋）：户 = 竖向一列房间
hh_columns = [1, 2]                  # 一户占几列
max_rooms = 72                       # 一座楼一圈最多几间（圆楼外环每层 48–72 间）
min_rooms = 24
gap_factor = 1.0                     # 楼距 ≥ 这么多个直径
front_pond = true                    # 门前半月池 + 禾坪（围龙屋）
pond_name = "半月池"
threshing_name = "禾坪"

[growth]                             # 一户一户落位的评分（值越大越先）
w_dist = 1.0                         # 离村心（直线）
w_net = 1.0                          # 离村心（沿路）
w_interest = 0.6                     # 兴趣图
w_kin = 0.8                          # 离父户（同一房支挨着住）
w_contact = 0.3                      # 与已有宅院贴着（成排）
noise = 0.15                         # 每个候选地块固定的一点随机
main_discount = 0.7                  # 主街上每米的「路程」打折（村子顺主街长）

# ---------------------------------------------------------------- 朝向（6.3）
[orient]
snap_deg = 0.0                       # 朝向量化（相对朝阳方向）；0 = 不量化
sun_offset_deg = 0.0                 # 朝阳的偏角（正 = 顺时针）
[[orient.rule]]
kind = "sun"                         # sun / wind / street / gable_street / align_street / water / downslope / fixed
weight = 1.0
tol_deg = 30.0

[gate]                               # 门开在哪（从门所在的一侧看；左右 = 站在院里面朝前沿时的左手 / 右手）
front = "left"                       # 路在前沿：前沿靠左的角（坐北朝南即东南巽位）
back = "right"                       # 路在后面：后沿靠右的角（坐北朝南即西北乾位）
side = "front"                       # 路在侧面：侧边靠前的一端
width_m = [2.4, 3.2]

# ---------------------------------------------------------------- 宅院模板（6.5）
# [compound.templates.<id>]：weight > 0 的是住宅模板（按权重挑）；其余给功能引用。
# 各栋 b：side = back / front / left / right（贴着地块的哪条边）；bays × bay_m 定面阔（没有 bays 就按 len_frac 占这条边的比例）；
# pos = 在这条边上的位置（0 = 左 / 前端，1 = 右 / 后端，0.5 = 居中）；face = front（朝地块前沿）/ in（朝院心）/ out；
# prob = 这一栋出现的概率；plinth_m = 台基高；roof = gable 硬山 / hip 庑殿 / hip_gable 歇山 / flat / shed 单坡 / saddle 悬山；
# attach = left / right：贴在同一条边上前一栋的左 / 右头（耳房贴正房），放不下就不要。
[compound]
wall_thickness_m = 0.4
yard_min_m = 4.0                     # 院心最窄（两厢之间、前后排之间）

# 围合单体（shape = ring 圆楼 / square_ring 方楼 / weilong 围龙屋）不按边摆：各栋按 role 取——ring 环上的房间（户）、hall 祖堂、gate 大门、
# side_row 横屋；ring_room_m 每间弧长、ring_depth_m 房进深、ring_storeys 层数。ops = ["contour"] 这样的模板只给这些算子用。
# dug_in = true：后排挖进坡里（靠崖窑，roof = "cave" 的栋不算台基挖填）；sunken = true：地坑院（院心是坑）；garden_frac：地块后部做园。
# 院外单栋：b 里写 detached_m = [lo, hi]（离地块边多远）与 near = "water"（近水，桑拿）。

[compound.templates.temple]          # 通用的庙：正殿 + 山门 + 两庑（风格可以覆盖）
name = "庙"
kind = "public"
weight = 0.0
plot_w_m = [18.0, 24.0]
plot_d_m = [22.0, 30.0]
bay_m = [3.6, 4.2]
wall = true
gate = "center"                      # 山门居中
gate_house = true
[[compound.templates.temple.b]]
role = "hall"
name = "正殿"
func = "worship"
side = "back"
bays = [3, 3]
depth_m = [7.0, 9.0]
face = "front"
storeys = 1
eave_m = 4.2
roof = "hip_gable"
pitch_deg = 30.0
plinth_m = 0.9
[[compound.templates.temple.b]]
