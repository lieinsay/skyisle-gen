[compound.templates.temple]    # 关帝庙：正殿三间 + 山门 + 可能有两庑
name = "关帝庙"

[functions.temple]
enabled = true
name = "关帝庙"                # 十字街或村中（估）
site = { crossroad = 3.0, center = 2.0, main = 1.0 }
[functions.shrine]
enabled = true
name = "土地庙"                # 村口（估）
[functions.pond]
enabled = true
name = "坑塘"                  # 挖土筑房留下的坑，每村 1–4 个，多在村边低处（[4]†，数与位置为估）
[functions.pond_temple]
enabled = true
name = "龙王庙"                # 坑塘或河边（估）
[functions.threshing]
enabled = true
name = "场院"                  # 环村边、离家近，每处 500–2000 m²（[5]†，估）
[functions.tree]
enabled = true
name = "村口大树"
[functions.landing]
shed_name = "货棚"

[targets]                      # 均为估，待按口径 n 标定
lambda = [1.0, 1.6]            # 团状
orient_sun_share = [0.9, 1.0]  # 主屋朝向在 ±15° 内 ≥ 90%
coverage = [0.22, 0.45]        # 覆盖率 25–40%（估），放宽一点
