# 华北集村（docs/PLAN-TOWN.md 6.6 第 1 卡；数与出处 docs/TOWN-SOURCES.md §1）
# 集村，东西主街 1–2 条 + 南北胡同（鱼骨 / 井字）；三合院 / 四合院坐北朝南（南半球整座转 180°，坐南朝北），门开前沿左角（巽位），
# 路在院后时开后沿右角（乾位，北京「路南院」）；村口土地庙，十字街关帝庙，村边低处坑塘与龙王庙，场院环村边，井。

[meta]
id = "huabei"
name = "华北集村"
region = "华北平原（冀鲁豫）"
sources = ["TOWN-SOURCES §1：Smith 1899 [1]、合院规制 [3]、坑塘 [4]†、场院 [5]†、寨墙 [6]†、街宽 [7]†；其余为估"]

[site]
center_search_m = 300.0
[site.weights]
flat = 1.5
water = 0.8
dry = 1.2                    # 高燥
sun = 0.3
farmland = -0.2
edge = -1.0

[ground]
max_slope_deg = 12.0           # 平原村；到了坡上（太行山区的石头村）院子做成台地
max_cut_m = 1.2
max_terrace_m = 3.0

[village]
operators = { fishbone = 0.6, organic = 0.4 }   # 鱼骨街村 0.6、团块生长 0.4
households_per_compound = [1, 1]
founders = [1, 3]
kin_p = 0.65

[street]
main_width_m = [5.0, 8.0]      # 村主街 5–8 m（估）
street_width_m = [3.5, 5.0]
lane_width_m = [2.0, 4.0]      # 胡同 2–4 m（估）
trunk_width_m = [4.0, 6.0]
plot_gap_m = [0.0, 0.8]        # 院墙多相贴
setback_m = [0.0, 0.3]

[fishbone]
street_spacing_m = [50.0, 62.0]   # 一个街坊前后两排合院（宅基进深 20–30 m，估）
lane_spacing_m = [45.0, 95.0]
warp_m = 3.0
vacant_p = 0.05

[organic]
jitter_deg = 2.0                     # 院落大体成排
stagger_m = 0.8

[growth]
w_contact = 0.6
main_discount = 0.75

[orient]
snap_deg = 0.0
[[orient.rule]]
kind = "sun"                   # 正房朝阳，偏角 ±15° 内（估）
weight = 3.0
tol_deg = 15.0
[[orient.rule]]
kind = "align_street"          # 院落顺街成排
weight = 1.0
tol_deg = 4.0

[gate]
front = "left"
back = "right"
side = "front"
width_m = [2.6, 3.2]

# 宅基 12–20 × 20–30 m（≈ 0.4 亩，估）；正房 3–5 间，两厢，倒座；开间 3.0–3.6 m（估）
