[project]
name = "zhouzhu-gen"
version = "0.1.0"
description = "行星地形与文明生成器 —— Hägerstrand Model III 变体的文化连续场生成（规格：docs/12-扩散模型.md）"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "matplotlib>=3.8"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
zhouzhu = "zhouzhu_gen.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["zhouzhu_gen*"]

[tool.setuptools.package-data]
"zhouzhu_gen.web" = ["static/*.html", "static/vendor/*"]
