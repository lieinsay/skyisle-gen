<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>空岛 · 营建调试台</title>
<!-- 完全离线。数据：/api/town/styles、/api/town/sites、POST /api/town/plan（地面底图 PNG + 方案，段与 plan.json 相同） -->
<style>
:root{--bg:#0b0e14;--panel:#141922;--line:#26303f;--ink:#e6e9ef;--dim:#8a94a6;--acc:#f0b35a;--acc2:#5aa9f0;--ok:#6fcf7a;--bad:#ff6b5e;--soft:#f0c35a;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font:13px/1.45 "Microsoft YaHei","PingFang SC","Noto Sans CJK SC",system-ui,sans-serif;font-variant-numeric:tabular-nums}
#app{display:grid;grid-template-rows:44px 1fr 26px;grid-template-columns:270px 1fr 380px;height:100%}
header{grid-column:1/4;display:flex;align-items:center;gap:12px;padding:0 12px;background:var(--panel);border-bottom:1px solid var(--line)}
header h1{font-size:15px;margin:0;font-weight:600;letter-spacing:.5px;font-family:"Source Han Serif SC","Noto Serif CJK SC","SimSun",serif}
header .sp{flex:1}
button{cursor:pointer}
button.primary{background:var(--acc);color:#1b1408;border:1px solid var(--acc);border-radius:4px;padding:4px 12px;font:inherit;font-weight:600}
button:disabled{opacity:.45;cursor:default}
aside{background:var(--panel);overflow:auto;padding:10px 12px;border-right:1px solid var(--line)}
aside.right{border-right:0;border-left:1px solid var(--line)}
#mapWrap{position:relative;overflow:hidden;background:#05070d}
#map{position:absolute;left:0;top:0;width:100%;height:100%;display:block;cursor:crosshair}
footer{grid-column:1/4;display:flex;align-items:center;gap:16px;padding:0 12px;background:var(--panel);border-top:1px solid var(--line);color:var(--dim);font-size:12px;white-space:nowrap;overflow:hidden}
.sec{margin-bottom:14px}
.sec h3{font-size:12px;color:var(--dim);margin:0 0 6px;letter-spacing:.8px;font-weight:600}
.row{display:flex;align-items:center;gap:8px;margin:4px 0;flex-wrap:wrap}
.row label{min-width:48px;color:var(--dim)}
.row select,.row input[type=number],.row input[type=text]{flex:1;min-width:0;background:#0f131a;color:var(--ink);border:1px solid var(--line);border-radius:4px;padding:3px 6px;font:inherit}
.chk{display:flex;align-items:center;gap:6px;margin:2px 0;cursor:pointer}
.seg{display:flex;gap:0;margin:4px 0}
.seg label{flex:1;text-align:center;border:1px solid var(--line);padding:3px 0;cursor:pointer;color:var(--dim)}
.seg label:first-child{border-radius:4px 0 0 4px}.seg label:last-child{border-radius:0 4px 4px 0;border-left:0}
.seg input{display:none}.seg input:checked+span{color:var(--acc)}
table.kv{border-collapse:collapse;width:100%;font-size:12px}
table.kv td,table.kv th{padding:2px 4px;border-bottom:1px solid #1d2430;vertical-align:top;text-align:left}
table.kv td:first-child{color:var(--dim);white-space:nowrap}
.small{font-size:11px;color:var(--dim)}
.btnrow{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.btnrow button:not(.primary){background:#1f2937;color:var(--ink);border:1px solid var(--line);border-radius:4px;padding:4px 9px;font:inherit}
#tip{position:absolute;pointer-events:none;background:rgba(10,13,20,.93);border:1px solid var(--line);padding:5px 8px;border-radius:4px;font-size:12px;display:none;z-index:5;max-width:340px}
#loading{position:absolute;inset:0;display:none;align-items:center;justify-content:center;color:var(--dim);font-size:14px;background:rgba(5,7,13,.6);z-index:6}
#err{color:var(--bad);white-space:pre-wrap;font-size:12px}
textarea{width:100%;min-height:70px;background:#0f131a;color:var(--ink);border:1px solid var(--line);border-radius:4px;font:12px Consolas,monospace;padding:4px}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:2px 8px;font-size:11px;color:var(--dim);margin-top:6px}
.sw{display:inline-block;width:10px;height:10px;border-radius:2px;vertical-align:middle;margin-right:4px}
.ck{display:flex;gap:6px;font-size:12px;padding:2px 0;border-bottom:1px solid #1d2430}
.ck b{width:14px;flex:none}
.ck.ok b{color:var(--ok)}.ck.bad b{color:var(--bad)}.ck.soft b{color:var(--soft)}
.ck span{flex:1}
details.fold{border-top:1px solid var(--line);padding-top:6px;margin:8px 0}
details>summary{cursor:pointer;color:var(--dim);font-size:12px;letter-spacing:.8px;font-weight:600;list-style:none;user-select:none}
details>summary::before{content:'▸ ';display:inline-block;width:12px}
details[open]>summary::before{content:'▾ '}
#pick{background:#0f131a;border:1px solid var(--line);border-radius:4px;padding:6px 8px;min-height:40px}
a{color:var(--acc2)}
</style>
</head>
<body>
<div id="app">
<header>
  <h1>空岛 · 营建调试台</h1>
  <span class="pill" title="营建器只给用户做参考，暂不接进游戏：游戏里的村子仍是 Zhouzhu 自己铺的" style="border:1px solid var(--acc);color:var(--acc);border-radius:10px;padding:1px 8px;font-size:11px;white-space:nowrap">参考用 · 暂不接入游戏</span>
  <span class="small" id="hdr"></span>
  <span class="sp"></span>
  <a href="#" id="islandLink" class="small" style="display:none">← 岛群调试台</a>
</header>

<aside>
  <div class="sec"><h3>地</h3>
    <div class="seg"><label><input type="radio" name="src" value="synth" checked><span>合成地形</span></label><label><input type="radio" name="src" value="site"><span>岛群聚落</span></label></div>
    <div id="synthBox">
      <div class="row"><label>地形</label><select id="terrain"></select></div>
      <div class="row"><label>户数</label><input id="hh" type="number" value="40" min="1" max="400"><label style="min-width:30px">种子</label><input id="seed" type="number" value="1"></div>
      <div class="row"><label>纬度</label><input id="lat" type="text" placeholder="默认（北纬 35°）" title="负 = 南半球（朝阳 = 朝北）"></div>
      <div class="row"><label>规模</label><select id="scale"><option>村</option><option>小庄</option><option>宅院</option></select></div>
    </div>
    <div id="siteBox" style="display:none">
      <div class="row"><label>run</label><input id="run" type="text" value="seed42"><label style="min-width:30px">节点</label><input id="node" type="number" value="2051"></div>
      <div class="row"><label>聚落</label><select id="site"></select></div>
      <div class="btnrow"><button id="btnSites">读聚落清单</button></div>
      <div id="siteNote" class="small"></div>
    </div>
  </div>
  <div class="sec"><h3>风格</h3>
    <div class="row"><label>风格</label><select id="style"></select></div>
    <div id="region" class="small"></div>
    <div class="row"><label>算子</label><select id="op"></select></div>
    <label class="chk small"><input type="checkbox" id="auto" checked> 换风格 / 算子就重新营建</label>
  </div>
  <div class="sec"><h3>参数覆盖</h3>
    <textarea id="sets" placeholder="一行一条：&#10;style.street.lane_width_m=[2,3]&#10;style.orient.rule.0.weight=1&#10;town.render.contour_m=2"></textarea>
    <div class="btnrow"><button class="primary" id="btnPlan">营建</button><button id="btnSave" title="照命令行写整套产物：plan.json / site.npz / plan.png / plan-detail.png / plan.svg / style.resolved.toml">保存产物</button><button id="btnShow" title="看这个风格解析后的全部参数（base ← 风格 ← 覆盖）">看参数</button></div>
    <div id="err"></div>
  </div>
  <div class="sec"><h3>图层</h3>
    <label class="chk"><input type="checkbox" id="lyGround" checked> 地面（田 / 水 / 晕渲 / 漫水 / 崖缘）</label>
    <label class="chk"><input type="checkbox" id="lyArea" checked> 面状地物（田块、林、公地、场、塘、园）</label>
    <label class="chk"><input type="checkbox" id="lyRoad" checked> 路与桥</label>
    <label class="chk"><input type="checkbox" id="lyYard" checked> 院与墙</label>
    <label class="chk"><input type="checkbox" id="lyBld" checked> 房</label>
    <label class="chk"><input type="checkbox" id="lyFront" checked> 房的正面（檐口 / 门一侧）</label>
    <label class="chk"><input type="checkbox" id="lyGate"> 院门与接路点</label>
    <label class="chk"><input type="checkbox" id="lyPoint" checked> 井、树、牌坊</label>
    <label class="chk"><input type="checkbox" id="lyLabel" checked> 名字</label>
    <label class="chk"><input type="checkbox" id="lyCenter"> 村心、朝向与半径</label>
    <label class="chk"><input type="checkbox" id="lyRiver"> 河中线</label>
    <label class="chk" title="C++ 里判占地用的栅格（1 m 一格）：路 / 院 / 房 / 塘 / 场院 / 泊场 / 桥 / 公地 / 環濠，盖在最上面对照矢量"><input type="checkbox" id="lyOcc"> 占用栅格</label>
    <label class="chk"><input type="checkbox" id="lyTerrace"> 台基高差（院按台基着色）</label>
    <div class="legend" id="legend"></div>
  </div>
  <div class="sec small">滚轮缩放 · 拖动平移 · 悬停读房子 · 单击钉住 · F 适配建成区 · A 全窗</div>
</aside>

<div id="mapWrap">
  <canvas id="map"></canvas>
  <div id="tip"></div>
  <div id="loading">营建中…</div>
</div>

<aside class="right">
  <div class="sec"><h3>方案</h3><table class="kv" id="sum"></table></div>
  <div class="sec"><h3>校验</h3><div id="checks" class="small">—</div></div>
  <div class="sec"><h3>选中</h3><div id="pick" class="small">单击房、院、路、地物钉住它的说明</div></div>
  <details class="fold" open><summary>形态指标</summary><table class="kv" id="metrics"></table></details>
  <details class="fold"><summary>地面</summary><table class="kv" id="ground"></table></details>
  <details class="fold"><summary>风格参数</summary><pre id="styleDump" class="small" style="white-space:pre-wrap"></pre></details>
</aside>

<footer><span id="coords"></span><span class="sp"></span><span id="foot"></span></footer>
</div>

<script>
'use strict';
const $ = id => document.getElementById(id);
const fmt = (x, d = 1) => (x === null || x === undefined || Number.isNaN(x)) ? '—' : Number(x).toFixed(d);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));

// ---------------------------------------------------------------- 与 town/render.py 同一套颜色
const ROAD_CLS = {trunk: 0, main: 1, street: 2, lane: 3, path: 4};
const ROAD_COLOR = ['#c9b68a', '#d8c79b', '#e0d0a8', '#e8dcba', '#cfc293'];
const YARD = '#ece3cd', WALL = '#5a4d40', BRIDGE = '#7a6048', WELL = '#2f6db5', TREE = '#3f7d3a', MOAT = '#4a7fc0', CHANNEL = '#5b93cf', ARCH = '#7a2e22';
const AREA = {   // kind → [填, 边, 图层（< 7 在院子下面）, 不透明度, 名]
  furlong: ['#d8c276', '#a88f45', 2.4, 0.45, '条田（敞田）'], strip: ['#e2d49a', '#9c8a52', 2.5, 0.35, '条地'], grove: ['#4f7f45', '#35602f', 2.7, 0.55, '林带'],
  green: ['#b6cf86', '#86a45a', 2.8, 0.95, '公地 / 村绿'], square: ['#e4d8bd', '#b3a384', 2.9, 0.95, '广场'], threshing: ['#e6d49e', '#b09a5c', 3.0, 1, '场院'],
  landing: ['#cfc7b4', '#7d7563', 3.0, 1, '泊场'], pond: ['#5c8fc9', '#3d6ea8', 3.0, 1, '塘'], steps: ['#9d958a', '#5f584f', 6.8, 1, '河埠头'],
  garden: ['#c9d99b', '#9fb46a', 7.2, 0.9, '园（croft）'], pit: ['#8e7757', '#5d4a35', 7.3, 1, '地坑院的坑'],
};
const BK = [
  [(f, r) => f === 'gate' || r === 'gatehouse' || r === 'gate', '#2e241c', '门楼 / 大门'],
  [f => f === 'worship' || f === 'inn', '#9c2f25', '庙 / 祠 / 教堂'],
  [f => ['shrine', 'pond_temple', 'castle', 'manor', 'shuikou'].includes(f), '#b8433a', '小庙 / 城堡 / 庄园'],
  [f => f === 'landing_shed', '#4f6277', '泊场货棚'],
  [(f, r, roof) => roof === 'cave', '#a0784c', '窑'],
  [(f, r) => r === 'detached' || f === 'bath' || f === 'smithy', '#8c4a2f', '院外单栋（浴房、铁匠）'],
  [f => f === 'shop', '#6e5a7a', '店屋'],
  [(f, r) => r === 'ring' || r === 'side_row', '#6a5646', '环楼 / 横屋'],
  [(f, r) => r === 'main', '#4a3b30', '正房 / 主屋'],
  [f => f === 'barn' || f === 'byre', '#7d6a50', '谷仓 / 畜舍'],
  [f => f === 'kitchen', '#80695a', '灶房'],
  [(f, r) => f === 'store' || r === 'front', '#8b7763', '倒座 / 杂屋'],
];
const BK_OTHER = ['#6a5646', '厢房 / 住房'];
function bkind(b){ for (const [t, c, n] of BK) if (t(b.func, b.role, b.roof)) return [c, n]; return BK_OTHER; }
const ROLE_ZH = {main: '正房 / 主屋', wing: '厢房', front: '倒座', barn: '仓', ear: '耳房', hall: '厅堂', side_hall: '侧厅', gate: '门楼', gatehouse: '门楼', kitchen: '灶房',
  ring: '环楼', side_row: '横屋', tower: '楼', detached: '院外单栋', public: '公共'};
const OCC_RGB = {1: [200, 180, 130], 2: [236, 227, 205], 3: [120, 40, 40], 4: [60, 110, 200], 5: [230, 200, 120], 6: [150, 150, 140], 7: [122, 96, 72], 8: [150, 200, 110], 9: [70, 120, 190]};
const OCC_ZH = ['空', '路', '院', '房', '塘', '场院', '泊场', '桥', '公地 / 广场 / 林带 / 坑', '環濠'];
const WATER_ZH = ['', '河', '季节性溪涧', '湖 / 海', '湖 / 海'];
const METRIC_ZH = {
  households: '户（要住）', households_placed: '户（住下）', compounds: '宅院', buildings: '房', bridges: '桥', wells: '井',
  lambda: '外包长宽比 λ', shape_index: '形状指数 S', coverage: '覆盖率', clark_evans: 'Clark–Evans R', density_hh_per_ha: '密度（户 / ha）',
  orient_sun_share: '朝阳占比', orient_dev_mean_deg: '朝向平均偏差（°）', face_street_share: '面街占比', frontage_cv: '面宽变异系数',
  site_nn_median_m: '簇间最近邻中位（m）', site_clark_evans: '簇的 R', sites: '簇数', water_front_share: '临水占比', lane_spacing_cv: '巷距变异系数',
  hh_per_enclosure: '每楼户数', enclosures: '围合单体数', terraces: '台层数', well_dist_median_m: '离井中位（m）', field_dist_median_m: '离田中位（m）',
  center_shift_m: '村心离锚点（m）', cut_m3: '挖方（m³）', fill_m3: '填方（m³）', footprint_m2: '占地（m²）', terraced_compounds: '做台地的院',
  dug_in_compounds: '挖进坡的院', junction_t: 'T 路口', junction_x: '十字路口', t_x_ratio: 'T / X 路口比', green_area_m2: '公地面积（m²）',
  buildings_per_compound_median: '每院栋数中位', detached_min_m: '院外单栋离主院最近（m）', lane_spacing_m: '巷距（m）',
  buildable_share_near: '村心一带能盖房的地', terrain_relax_level: '地形优先：放宽了几档', max_slope_deg_used: '实用的坡上限（°）',
  max_cut_m_used: '实用的挖填上限（m）', max_terrace_m_used: '实用的台地上限（m）', lambda_room_share: 'λ 到目标那头时能盖房的地',
  orient_terrain_share: '朝阳或顺坡的占比',
};
const PCT = new Set(['coverage', 'orient_sun_share', 'face_street_share', 'water_front_share', 'buildable_share_near', 'lambda_room_share', 'orient_terrain_share']);

// ---------------------------------------------------------------- 状态
let STY = null, D = null, G = null, groundImg = null, occCanvas = null, pinned = null;
const view = {s: 1, tx: 0, ty: 0};
const cv = $('map'), ctx = cv.getContext('2d');
const qs = new URLSearchParams(location.search);

function dec(b64, T){ const bin = atob(b64); const u = new Uint8Array(bin.length); for (let k = 0; k < bin.length; k++) u[k] = bin.charCodeAt(k); return new T(u.buffer); }
const ext = () => D.ground.extent;   // [x0, x1, y0, y1]（m）
const W2S = (x, y) => [(x - ext()[0]) * view.s + view.tx, (ext()[3] - y) * view.s + view.ty];
const S2W = (px, py) => [(px - view.tx) / view.s + ext()[0], ext()[3] - (py - view.ty) / view.s];

function obb(c, fdeg, w, d){
  const f = fdeg * Math.PI / 180; const fx = Math.sin(f) * d / 2, fy = Math.cos(f) * d / 2, rx = Math.cos(f) * w / 2, ry = -Math.sin(f) * w / 2;
  return [[c[0] + fx + rx, c[1] + fy + ry], [c[0] + fx - rx, c[1] + fy - ry], [c[0] - fx - rx, c[1] - fy - ry], [c[0] - fx + rx, c[1] - fy + ry]];
}
function inObb(p, c, fdeg, w, d){
  const f = fdeg * Math.PI / 180; const dx = p[0] - c[0], dy = p[1] - c[1];
  return Math.abs(dx * Math.cos(f) - dy * Math.sin(f)) <= w / 2 && Math.abs(dx * Math.sin(f) + dy * Math.cos(f)) <= d / 2;
}
function inPoly(p, poly){ let c = false; for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) { const a = poly[i], b = poly[j]; if ((a[1] > p[1]) !== (b[1] > p[1]) && p[0] < (b[0] - a[0]) * (p[1] - a[1]) / (b[1] - a[1]) + a[0]) c = !c; } return c; }
function segDist(p, a, b){ const vx = b[0] - a[0], vy = b[1] - a[1]; const L2 = vx * vx + vy * vy; let t = L2 ? ((p[0] - a[0]) * vx + (p[1] - a[1]) * vy) / L2 : 0; t = Math.max(0, Math.min(1, t)); return Math.hypot(p[0] - a[0] - t * vx, p[1] - a[1] - t * vy); }
function lineDist(p, line){ let d = Infinity; for (let k = 0; k + 1 < line.length; k++) d = Math.min(d, segDist(p, line[k], line[k + 1])); return d; }
function lineLen(line){ let s = 0; for (let k = 0; k + 1 < line.length; k++) s += Math.hypot(line[k + 1][0] - line[k][0], line[k + 1][1] - line[k][1]); return s; }

// ---------------------------------------------------------------- 画
function resize(){ const r = cv.parentElement.getBoundingClientRect(); const dpr = window.devicePixelRatio || 1; cv.width = r.width * dpr; cv.height = r.height * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0); }
function fit(box){
  const r = cv.parentElement.getBoundingClientRect(); const [x0, x1, y0, y1] = box;
  view.s = Math.min(r.width / (x1 - x0), r.height / (y1 - y0)) * 0.95;
  view.tx = r.width / 2 - ((x0 + x1) / 2 - ext()[0]) * view.s; view.ty = r.height / 2 - (ext()[3] - (y0 + y1) / 2) * view.s;
}
function planBox(){
  const P = D && D.plan; if (!P || !P.compounds.length) return ext();
  let x0 = Infinity, x1 = -Infinity, y0 = Infinity, y1 = -Infinity;
  const add = p => { x0 = Math.min(x0, p[0]); x1 = Math.max(x1, p[0]); y0 = Math.min(y0, p[1]); y1 = Math.max(y1, p[1]); };
  for (const c of P.compounds) for (const q of obb(c.plot.c, c.plot.facing_deg, c.plot.w, c.plot.d)) add(q);
  for (const f of P.features) if (['pond', 'threshing', 'landing', 'green', 'square', 'moat'].includes(f.kind)) (f.poly && f.poly.length ? f.poly : [f.p]).forEach(add);
  const m = 40; return [x0 - m, x1 + m, y0 - m, y1 + m];
}
function path(pts){ ctx.beginPath(); pts.forEach((p, k) => { const [x, y] = W2S(p[0], p[1]); k ? ctx.lineTo(x, y) : ctx.moveTo(x, y); }); }
function on(id){ return $(id).checked; }

function draw(){
  const r = cv.parentElement.getBoundingClientRect();
  ctx.clearRect(0, 0, r.width, r.height);
  if (!D) return;
  const P = D.plan, s = view.s;
  if (on('lyGround') && groundImg) {
    const [a, b] = W2S(ext()[0], ext()[3]), [c, d] = W2S(ext()[1], ext()[2]);
    ctx.imageSmoothingEnabled = s * D.ground.stride * D.frame.res_m < 3;
    ctx.drawImage(groundImg, a, b, c - a, d - b);
  }

function markOps(){
  const fit = new Set(D.ops_fit || []);
  for (const o of $('op').options) if (o.value) o.textContent = opName(o.value) + (D.plan && fit.size && !fit.has(o.value) ? '（这块地不合适）' : '');
}
function fillOps(){
  const s = STY.styles.find(x => x.id === $('style').value); const keep = $('op').value;
  $('op').innerHTML = `<option value="">按风格的权重挑</option>` + s.operators.map(o => `<option value="${o.id}">${esc(o.name)}（${o.id}，权重 ${o.weight}）</option>`).join('');
  if (s.operators.some(o => o.id === keep)) $('op').value = keep;
  $('region').innerHTML = `${esc(s.region)}${s.window_factor !== 1 ? ` · 窗口 × ${s.window_factor}` : ''}<br>${s.sources.map(esc).join('<br>')}`;
}
async function loadSites(select){
  $('siteNote').textContent = '读取中…';
  try {
    const r = await fetch(`/api/town/sites?run=${encodeURIComponent($('run').value.trim())}&node=${+$('node').value}`); const j = await r.json(); if (j.error) throw new Error(j.error);
    const rows = [...j.sites].sort((a, b) => (b.plannable - a.plannable) || (b.households - a.households));
    $('site').innerHTML = rows.map(x => `<option value="${esc(x.name)}" ${x.plannable ? '' : 'disabled'}>${esc(x.name)} · ${esc(x.kind)} ${x.households} 户 · 岛 ${x.island}${x.note ? '（' + esc(x.note) + '）' : ''}</option>`).join('');
    if (select && rows.some(x => x.name === select)) $('site').value = select;
    $('siteNote').textContent = `${rows.length} 处（能营建 ${rows.filter(x => x.plannable).length}）${j.city ? ' · 这个岛群是都' : ''}`;
    const link = $('islandLink'); link.style.display = ''; link.href = `/island.html?run=${encodeURIComponent($('run').value.trim())}&node=${+$('node').value}`;
  } catch (e) { $('siteNote').textContent = String(e.message || e); }
}
function syncUrl(){
  const b = body(false); const u = new URLSearchParams();
  if (b.source === 'site') { u.set('run', b.run); u.set('node', b.node); u.set('site', b.site); } else { u.set('terrain', b.terrain); u.set('hh', b.households); u.set('seed', b.seed); if (b.lat) u.set('lat', b.lat); }
  if (b.style) u.set('style', b.style); if (b.operator) u.set('op', b.operator);
  history.replaceState(null, '', '/town.html?' + u.toString());
}
async function showStyle(){
  const sets = $('sets').value.split('\n').map(s => s.trim()).filter(s => s.startsWith('style.'));
  $('styleDump').textContent = '（打开「风格参数」一栏看）';
  const r = await fetch(`/api/town/style?name=${encodeURIComponent($('style').value)}&sets=${encodeURIComponent(JSON.stringify(sets))}`); const t = await r.text();
  $('styleDump').textContent = t; $('styleDump').closest('details').open = true;
}

// ---------------------------------------------------------------- 起动
async function init(){
  resize();
  STY = await (await fetch('/api/town/styles')).json();
  $('terrain').innerHTML = STY.terrains.map(t => `<option>${t}</option>`).join('');
  $('style').innerHTML = STY.styles.map(s => `<option value="${s.id}">${esc(s.name)}</option>`).join('');
  $('terrain').value = qs.get('terrain') || '河谷';
  if (qs.get('style')) { const s = STY.styles.find(x => x.id === qs.get('style') || x.name === qs.get('style')); if (s) $('style').value = s.id; }
  fillOps(); if (qs.get('op')) $('op').value = qs.get('op');
  for (const [k, id] of [['hh', 'hh'], ['seed', 'seed'], ['lat', 'lat']]) if (qs.get(k)) $(id).value = qs.get(k);
  if (qs.get('run')) {
    document.querySelector('input[name=src][value=site]').checked = true; srcChanged();
    $('run').value = qs.get('run'); if (qs.get('node')) $('node').value = qs.get('node');
    await loadSites(qs.get('site'));
  }
  document.querySelectorAll('input[name=src]').forEach(r => r.addEventListener('change', srcChanged));
  $('style').addEventListener('change', () => { fillOps(); if (on('auto')) plan(); });
  $('op').addEventListener('change', () => { if (on('auto')) plan(); });
  $('site').addEventListener('change', () => { if (on('auto')) plan(); });
  $('btnPlan').onclick = () => plan(false); $('btnSave').onclick = () => plan(true); $('btnShow').onclick = showStyle;
  $('btnSites').onclick = () => loadSites();
  document.querySelectorAll('aside input[type=checkbox][id^=ly]').forEach(c => c.addEventListener('change', draw));
  plan();
}
function srcChanged(){ const site = document.querySelector('input[name=src]:checked').value === 'site'; $('synthBox').style.display = site ? 'none' : ''; $('siteBox').style.display = site ? '' : 'none'; if (site && !$('site').options.length) loadSites(); }

let drag = null, moved = false;
cv.addEventListener('mousedown', e => { drag = {x: e.clientX, y: e.clientY, tx: view.tx, ty: view.ty}; moved = false; });
window.addEventListener('mouseup', e => {
  if (drag && !moved && D) { const h = hit(S2W(e.offsetX, e.offsetY)); if (e.target === cv) { pinned = h; showPick(); draw(); } }
  drag = null;
});
cv.addEventListener('mousemove', e => {
  if (drag) { if (Math.abs(e.clientX - drag.x) + Math.abs(e.clientY - drag.y) > 3) moved = true; view.tx = drag.tx + e.clientX - drag.x; view.ty = drag.ty + e.clientY - drag.y; draw(); return; }
  if (!D) return;
  const p = S2W(e.offsetX, e.offsetY), g = groundAt(p), h = hit(p), tip = $('tip');
  $('coords').textContent = `x ${fmt(p[0], 1)} m · y ${fmt(p[1], 1)} m` + (g ? ` · 高 ${g.h === null ? '虚空' : fmt(g.h, 1) + ' m'}${g.water ? ' · ' + WATER_ZH[g.water] : ''}${G.occ ? ' · 占用：' + OCC_ZH[g.occ] : ''}` : '');
  if (h) { tip.innerHTML = describe(h); tip.style.display = 'block'; const r = cv.parentElement.getBoundingClientRect(); tip.style.left = Math.min(e.offsetX + 14, r.width - 350) + 'px'; tip.style.top = (e.offsetY + 14) + 'px'; }
  else tip.style.display = 'none';
});
cv.addEventListener('mouseleave', () => $('tip').style.display = 'none');
cv.addEventListener('wheel', e => {
  e.preventDefault(); if (!D) return; const k = Math.exp(-e.deltaY * 0.0015); const s2 = Math.max(0.02, Math.min(80, view.s * k)); const kk = s2 / view.s;
  view.tx = e.offsetX - (e.offsetX - view.tx) * kk; view.ty = e.offsetY - (e.offsetY - view.ty) * kk; view.s = s2; draw();
}, {passive: false});
window.addEventListener('keydown', e => {
  if (!D || ['INPUT', 'TEXTAREA', 'SELECT'].includes(document.activeElement.tagName)) return;
  if (e.key === 'f' || e.key === 'F') { fit(planBox()); draw(); } if (e.key === 'a' || e.key === 'A') { fit(ext()); draw(); }
});
window.addEventListener('resize', () => { resize(); draw(); });
init();
</script>
