<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>州渚 · 行星操作台</title>
<!-- 完全离线：不加载任何远程资源；globe.gl 随包内置于 vendor/，单文件导出时内嵌 -->
<style>
/* 单一视觉世界：深空控制台（行星在黑底上；不随宿主主题切换，所有颜色显式） */
:root{--bg:#0b0e14;--panel:#141922;--line:#26303f;--ink:#e6e9ef;--dim:#8a94a6;--acc:#f0b35a;--acc2:#5aa9f0;
  --daily:#4d9de0;--trade:#f39c3c;--envoy:#3fbf7f;--migrate:#e05a5a;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font:13px/1.45 "Microsoft YaHei","PingFang SC","Noto Sans CJK SC",system-ui,sans-serif;font-variant-numeric:tabular-nums}
header h1{font-family:"Source Han Serif SC","Noto Serif CJK SC","SimSun",serif}
#app{display:grid;grid-template-rows:44px 1fr 26px;grid-template-columns:290px 1fr 380px;height:100%}
header{grid-column:1/4;display:flex;align-items:center;gap:12px;padding:0 12px;background:var(--panel);border-bottom:1px solid var(--line)}
header h1{font-size:15px;margin:0;font-weight:600;letter-spacing:.5px}
header .sp{flex:1}
header select,header input,header button{background:#0f131a;color:var(--ink);border:1px solid var(--line);border-radius:4px;padding:4px 8px;font:inherit}
button{cursor:pointer}
button.primary{background:var(--acc);color:#1b1408;border-color:var(--acc);font-weight:600}
button:disabled{opacity:.45;cursor:default}
aside{background:var(--panel);overflow:auto;padding:10px 12px;border-right:1px solid var(--line)}
aside.right{border-right:0;border-left:1px solid var(--line);padding:0}
/* globe.gl 初始化会清空容器的 innerHTML，所以悬停框与加载遮罩放在外层 #globeWrap 里，不放进 #globe */
#globeWrap{position:relative;overflow:hidden;background:#05070d}
#globe{position:absolute;inset:0}
#globe canvas{display:block}
footer{grid-column:1/4;display:flex;align-items:center;gap:16px;padding:0 12px;background:var(--panel);border-top:1px solid var(--line);color:var(--dim);font-size:12px;white-space:nowrap;overflow:hidden}
.sec{margin-bottom:14px}
.sec h3{font-size:12px;color:var(--dim);margin:0 0 6px;text-transform:uppercase;letter-spacing:.8px;font-weight:600}
.row{display:flex;align-items:center;gap:8px;margin:4px 0;flex-wrap:wrap}
.row label{min-width:64px;color:var(--dim)}
.row select,.row input[type=number],.row input[type=text]{flex:1;min-width:0;background:#0f131a;color:var(--ink);border:1px solid var(--line);border-radius:4px;padding:3px 6px;font:inherit}
.row input[type=range]{flex:1}
.chk{display:flex;align-items:center;gap:6px;margin:3px 0;cursor:pointer}
.tabs{display:flex;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel);z-index:2}
.tabs button{flex:1;background:none;border:0;color:var(--dim);padding:9px 0;font:inherit;border-bottom:2px solid transparent}
.tabs button.on{color:var(--ink);border-bottom-color:var(--acc)}
.tab{display:none;padding:10px 12px}
.tab.on{display:block}
table.kv{border-collapse:collapse;width:100%;font-size:12px}
table.kv td{padding:2px 4px;border-bottom:1px solid #1d2430;vertical-align:top}
table.kv td:first-child{color:var(--dim);white-space:nowrap}
.bar{display:inline-block;height:8px;border-radius:2px;vertical-align:middle;margin-right:4px}
.pill{display:inline-block;padding:1px 7px;border-radius:10px;font-size:11px;background:#1f2937;color:var(--ink);margin:1px 2px}
.pill.pass{background:#1d4d33;color:#9be0b6}.pill.fail{background:#5a2323;color:#f0a2a2}.pill.warn{background:#5a4a1a;color:#f0d88a}
.mode-daily{color:var(--daily)}.mode-trade{color:var(--trade)}.mode-envoy{color:var(--envoy)}.mode-migrate{color:var(--migrate)}
.md h1{font-size:15px;margin:6px 0}.md h2{font-size:13px;margin:10px 0 4px;color:var(--acc)}
.md table{border-collapse:collapse;width:100%;font-size:12px;margin:6px 0}
.md td,.md th{border:1px solid var(--line);padding:3px 5px;vertical-align:top}
.md blockquote{color:var(--dim);border-left:3px solid var(--line);margin:6px 0;padding:2px 8px}
.md ul{margin:4px 0;padding-left:16px}
.legend{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--dim);margin-top:4px}
.legend .grad{flex:1;height:8px;border-radius:2px}
.ticks{display:flex;justify-content:space-between;font-size:10px;color:var(--dim);margin-top:1px}
#surfLegend,#edgeLegend{margin-top:4px;font-size:11px;color:var(--dim)}
#log{font-family:Consolas,monospace;font-size:11px;white-space:pre-wrap;background:#0f131a;border:1px solid var(--line);padding:6px;max-height:180px;overflow:auto;color:var(--dim)}
.param-grid{display:grid;grid-template-columns:auto repeat(4,1fr);gap:3px 6px;align-items:center;font-size:12px}
.param-grid input{width:100%;background:#0f131a;color:var(--ink);border:1px solid var(--line);border-radius:3px;padding:2px 4px;font:inherit}
.param-grid .h{color:var(--dim);text-align:center}
.small{font-size:11px;color:var(--dim)}
.btnrow{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.btnrow button{background:#1f2937;color:var(--ink);border:1px solid var(--line);border-radius:4px;padding:4px 9px;font:inherit}
#tip{position:absolute;pointer-events:none;background:rgba(10,13,20,.92);border:1px solid var(--line);padding:5px 8px;border-radius:4px;font-size:12px;display:none;z-index:5;max-width:280px}
#loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--dim);font-size:14px;background:#05070d;z-index:6}
/* 视角切换 */
.lens{display:flex;gap:2px;background:#0f131a;border:1px solid var(--line);border-radius:6px;padding:2px;margin-bottom:6px}
.lens button{flex:1;background:none;border:0;border-radius:4px;color:var(--dim);padding:5px 0;font:inherit}
.lens button.on{background:var(--acc);color:#1b1408;font-weight:600}
#lensDesc{margin:0 0 10px;min-height:16px}
.hidden{display:none!important}
#legend{flex-wrap:wrap;margin:4px 0 6px}
.pill{white-space:nowrap}
button.mini{background:#1f2937;color:var(--ink);border:1px solid var(--line);border-radius:3px;padding:0 5px;font:inherit;font-size:11px}
details.adv,details.fold{border-top:1px solid var(--line);padding-top:6px;margin:8px 0}
details>summary{cursor:pointer;color:var(--dim);font-size:12px;letter-spacing:.8px;font-weight:600;list-style:none;user-select:none}
details>summary::before{content:'▸ ';display:inline-block;width:12px}
details[open]>summary::before{content:'▾ '}
details.fold>summary{margin-bottom:4px}
#checkBadge{cursor:pointer}
#tab-check .small{overflow-wrap:anywhere}
</style>
</head>
<body>
<div id="app">
<header>
  <h1>州渚 · 行星操作台</h1>
  <span class="small" id="runinfo"></span>
  <span class="sp"></span>
  <label class="small">run</label><select id="runsel"></select>
  <button id="btnView">重置视角</button>
  <button id="btnRotate">自转</button>
  <span id="checkBadge"></span>
</header>

<aside class="left">
  <!-- 视角：每个视角是一组预设（底图 / 岛屿着色 / 叠加层），并只显示与之相关的控件（带 data-lens 的元素） -->
  <div class="lens" id="lensBar">
    <button data-l="geo" class="on">地理</button>
    <button data-l="climate">气候</button>
    <button data-l="routes">航运</button>
    <button data-l="culture">文化</button>
    <button data-l="polity">政治</button>
  </div>
  <div class="small" id="lensDesc"></div>

  <div class="row" id="rowMode" data-lens="routes culture"><label title="传播 / 通行的四种模式；航线着色、顺逆风、探针出边、路径、文化距离、隔离度共用">模式</label>
    <select id="modeSel"><option value="all" data-lens="culture">全部</option><option value="daily">日常往来</option><option value="trade">商旅</option><option value="envoy">使节学问</option><option value="migrate">人口迁徙</option></select></div>

  <div class="sec"><h3>岛屿</h3>
    <div class="row"><label>着色</label>
      <select id="colorBy">
        <option value="cls" data-lens="geo routes">地形类</option>
        <option value="area" data-lens="geo">岛群陆地</option>
        <option value="catch" data-lens="geo climate">集雨容量</option>
        <option value="region" data-lens="geo culture">地区（展示分区）</option>
        <option value="arrival" data-lens="geo culture">史前到达</option>
        <option value="precip" data-lens="climate">降水</option>
        <option value="stab" data-lens="climate">稳定度</option>
        <option value="flow" data-lens="routes">流量</option>
        <option value="trait" data-lens="culture">特征场</option>
        <option value="share" data-lens="culture">槽位份额</option>
        <option value="dist" data-lens="culture">文化距离（以家为基准）</option>
        <option value="iso" data-lens="culture routes">隔离度</option>
        <option value="suit" data-lens="culture">适宜度</option>
        <option value="polity" data-lens="polity">邦</option>
        <option value="realm" data-lens="polity">兼并：变法之国的本朝</option>
        <option value="pop" data-lens="polity">人口</option>
        <option value="control" data-lens="polity">都城控制力</option>
      </select></div>
    <div class="row" id="rowSlot"><label title="一类习俗（如葬俗、历法），其中各做法的份额和为 1">槽位</label><select id="slotSel"></select></div>
    <div class="row" id="rowValue"><label>做法</label><select id="valueSel"></select></div>
    <div class="row" id="rowTrait"><label>特征</label><select id="traitSel"></select></div>
    <div class="row" id="rowField"><label>量</label>
      <select id="fieldSel"><option value="strength" title="strength">强度</option><option value="reach" title="reach：传到的程度">传到</option><option value="adopt" title="adopt：传到后被接受的程度">采纳</option><option value="share" title="share：槽位内份额">份额</option></select></div>
    <div class="legend" id="legend"></div>
    <label class="chk"><input type="checkbox" id="lyIslands" checked> 显示岛屿</label>
    <label class="chk"><input type="checkbox" id="lyScale" checked> 点大小按陆地</label>
  </div>

  <div class="sec" data-lens="geo climate"><h3>底图</h3>
    <div class="row">
      <select id="surfSel">
        <option value="base" data-lens="geo climate">地貌</option>
        <option value="plate" data-lens="geo">浮石板块</option>
        <option value="age" data-lens="geo">岛龄</option>
        <option value="precip" data-lens="climate">降水</option>
        <option value="temp" data-lens="climate">海面温度 °C</option>
        <option value="speed" data-lens="climate">风速 m/s</option>
        <option value="storm" data-lens="climate">风暴强度</option>
        <option value="band" data-lens="climate">风带</option>
        <option value="q" data-lens="climate">水汽</option>
        <option value="uplift" data-lens="climate">撞墙抬升（雨影的来源）</option>
        <option value="obstacle" data-lens="climate">岛体障碍场</option>
        <option value="wake" data-lens="climate">尾流亏损</option>
      </select></div>
    <div class="row" id="rowSurfAlpha"><label>不透明度</label><input type="range" id="surfAlpha" min="0.3" max="1" step="0.05" value="0.85"><span id="surfAlphav">0.85</span></div>
    <label class="chk" id="rowContour"><input type="checkbox" id="surfContour" checked> 等值线</label>
    <div id="surfLegend"></div>
  </div>

  <div class="sec" data-lens="climate"><h3>风</h3>
    <label class="chk"><input type="checkbox" id="lyWind"> 风向流线</label>
    <div class="row" id="rowWindDens"><label>密度</label><input type="range" id="windDens" min="0.5" max="2.5" step="0.1" value="1"><span id="windDensv">1.0</span></div>
    <div class="small" id="windInfo"></div>
  </div>

  <div class="sec" data-lens="routes"><h3>航线</h3>
    <label class="chk"><input type="checkbox" id="lyEdges"> 显示航线</label>
    <div class="row" id="rowEdgeColor"><label>着色</label>
      <select id="edgeColor">
        <option value="flow">流量</option>
        <option value="perm">通过率（按模式）</option>
        <option value="wind">顺逆风（按模式）</option>
        <option value="barrier">所属障碍</option>
        <option value="plain">单色</option>
      </select></div>
    <div class="row" id="rowEdgeFilter"><label>筛选</label>
      <select id="edgeFilter">
        <option value="top">流量最大的 N 条</option>
        <option value="barrier">跨障碍</option>
        <option value="blocked">该模式不可通</option>
        <option value="gblock">被永暴 G 阻断</option>
        <option value="all">全部（慢）</option>
      </select></div>
    <div class="row" id="rowEdgeN"><label>N</label><input type="range" id="edgeN" min="500" max="12000" step="500" value="2000"><span id="edgeNv">2000</span></div>
    <div id="edgeLegend"></div>
  </div>

  <div class="sec" data-lens="culture polity"><h3>界线</h3>
    <label class="chk" data-lens="culture" title="份额跨过阈值的边：同一特征「有 / 无」的分界"><input type="checkbox" id="lyIso"> 同言线</label>
    <div class="row" id="rowTheta" data-lens="culture"><label>阈值</label><input type="range" id="theta" min="0.2" max="0.8" step="0.05" value="0.5"><span id="thetav">0.5</span></div>
    <label class="chk" data-lens="polity" title="两端属于不同政体的边；白 = 跨本朝，橙 = 本朝内旧邦界"><input type="checkbox" id="lyBorders"> 邦界</label>
  </div>

  <div class="sec"><h3>标注</h3>
    <label class="chk"><input type="checkbox" id="lyHubs"> 文明中心与枢纽</label>
    <label class="chk" data-lens="routes"><input type="checkbox" id="lyTrunks"> 中心间干线</label>
    <label class="chk" data-lens="geo routes" title="定点永暴 G（红圈）、赤道永暴带边缘、D 区（紫框）"><input type="checkbox" id="lyGeo"> 大障碍轮廓</label>
    <label class="chk" data-lens="climate" title="八条局部风带边界，随经度起伏"><input type="checkbox" id="lyBands"> 风带边界</label>
  </div>

  <details class="adv"><summary>高级</summary>
    <label class="chk"><input type="checkbox" id="showAll"> 显示所有视角的控件</label>
    <div class="small">切换视角会重置底图、着色与叠加层；勾上后可在一个视角里自由组合。</div>
  </details>
  <div class="sec small" id="hint">点岛屿看探针 · 悬停海面读风、温、雨</div>
</aside>

<div id="globeWrap"><div id="globe"></div><div id="tip"></div><div id="loading">加载中…</div></div>

<aside class="right">
  <div class="tabs">
    <button data-tab="probe" class="on">探针</button>
    <button data-tab="polity">政体</button>
    <button data-tab="grid">九格表</button>
    <button data-tab="dev" title="验收报告与参数重跑（改生成器时用）">开发</button>
  </div>
  <div class="tab on" id="tab-probe"><div class="small">点击岛屿查看。</div></div>
  <div class="tab" id="tab-grid"><div class="small">在探针里点「九格表」，或在下方选地区。</div>
    <div class="row"><label>地区</label><select id="regionSel"></select></div>
    <div class="md" id="gridBody"></div></div>
  <div class="tab" id="tab-polity"></div>
  <div class="tab" id="tab-dev">
    <details class="fold" id="foldCheck"><summary>验收报告</summary><div id="tab-check"></div></details>
    <details class="fold" id="foldParams" open><summary>参数与重新生成</summary><div id="tab-params"></div></details>
  </div>
</aside>

<footer><span id="status">就绪</span><span class="sp"></span><span id="coords"></span></footer>
</div>

<!--INLINE-->
<script src="vendor/globe.gl.min.js"></script><!--VENDOR-->
<script>
'use strict';
// ------------------------------------------------------------ 工具
const $ = id => document.getElementById(id);
const INLINE = window.__INLINE__ || null;
const MODES = ['daily','trade','envoy','migrate'];
const MODE_ZH = {daily:'日常往来',trade:'商旅',envoy:'使节学问',migrate:'人口迁徙'};
const MODE_COLOR = {daily:'#4d9de0',trade:'#f39c3c',envoy:'#3fbf7f',migrate:'#e05a5a'};
const CLASS_COLOR = ['#b06be0','#3fbf7f','#f0c34d','#e05a5a'];
const TAB20 = ['#1f77b4','#aec7e8','#ff7f0e','#ffbb78','#2ca02c','#98df8a','#d62728','#ff9896','#9467bd','#c5b0d5','#8c564b','#c49c94','#e377c2','#f7b6d2','#7f7f7f','#c7c7c7','#bcbd22','#dbdb8d','#17becf','#9edae5'];
const BARRIER_COLOR = ['#e05a5a','#f0c34d','#f0c34d','#b06be0','#5aa9f0','#5aa9f0'];

// ------------------------------------------------------------ 气象网格（R2：② wind.npz / ④ climate_grid.npz 的 1° 网格，只读产物）
const WEB_DEFAULT={streamline_spacing_deg:4,streamline_steps:40,streamline_step_deg:0.5,streamline_max:1500,wind_anim_ms:3000,overlay_alpha:0.85,overlay_contours:true};
const BAND_ZH={equatorial_storm:'赤道永暴带',trades_n:'信风带（北）',subtropical_calm_n:'副热带无风带（北）',westerlies_n:'西风带（北）',polar_n:'极地东风带（北）',trades_s:'信风带（南）',subtropical_calm_s:'副热带无风带（南）',westerlies_s:'西风带（南）',polar_s:'极地东风带（南）'};
const BAND_COLOR=['#c9694a','#e2b264','#f3e8cc','#7d93b8','#e3e9f0','#e2b264','#f3e8cc','#7d93b8','#e3e9f0'];
const COMPASS8=['北','东北','东','东南','南','西南','西','西北'];
function mkCmap(stops){ // stops: [[t,'#rrggbb'],…]，t 升序
  const s=stops.map(([t,h])=>[t,parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)]);
  return t=>{ t=Math.max(0,Math.min(1,t)); let k=0; while(k<s.length-2&&t>s[k+1][0]) k++; const a=s[k],b=s[k+1]; const f=Math.max(0,Math.min(1,(t-a[0])/Math.max(1e-9,b[0]-a[0]))); const c=[1,2,3].map(q=>Math.round(a[q]+(b[q]-a[q])*f)); return `rgb(${c[0]},${c[1]},${c[2]})`; };
}
const CMAP_WIND=mkCmap([[0,'#243f7a'],[0.2,'#2e86c1'],[0.4,'#3fbf7f'],[0.6,'#e6d13c'],[0.8,'#e0702a'],[1,'#b0202a']]);
const CMAP_TEMP=mkCmap([[0,'#1d2b7a'],[0.2,'#2f6fd0'],[0.4,'#cfe3f5'],[0.6,'#f4d58d'],[0.8,'#ea8a3c'],[1,'#b0202a']]);   // −20…30 °C，0 °C 落在 0.4
const CMAP_PRECIP=mkCmap([[0,'#f2ead2'],[0.3,'#9fd3c7'],[0.6,'#3f8fbf'],[0.85,'#1d3f8a'],[1,'#0d1d4a']]);
const CMAP_STORM=mkCmap([[0,'#0b0b1e'],[0.3,'#5a1f6e'],[0.6,'#b8386a'],[0.85,'#f08a3c'],[1,'#f8e08a']]);
const CMAP_WINDEDGE=mkCmap([[0,'#7f8899'],[0.5,'#f39c3c'],[1,'#e05a5a']]);
const CMAP_OBST=mkCmap([[0,'#0f131a'],[0.5,'#7a5a3a'],[1,'#e2b264']]);
const CMAP_WAKE=mkCmap([[0,'#0f131a'],[0.5,'#2e86c1'],[1,'#cfe3f5']]);
const CMAP_AGE=mkCmap([[0,'#f8e08a'],[0.5,'#c0663a'],[1,'#4a2c6e']]);
// 标量填色层：field = 网格场名；range 固定刻度（跨 run 可比）；contour = 等值线间隔
const SURF={
  speed:{label:'风速',unit:'m/s',field:'speed',cmap:CMAP_WIND,contour:4,range:()=>[0,Math.ceil(GR.max.speed/4)*4]},
  temp:{label:'海面温度',unit:'°C',field:'temp',cmap:CMAP_TEMP,contour:5,range:()=>[-20,30]},
  precip:{label:'降水（相对）',unit:'',field:'precip',cmap:CMAP_PRECIP,contour:0.1,range:()=>[0,1]},
  storm:{label:'风暴强度',unit:'',field:'storm',cmap:CMAP_STORM,contour:0.1,range:()=>[0,1]},
  q:{label:'水汽（相对）',unit:'',field:'q',cmap:CMAP_PRECIP,contour:0.1,range:()=>[0,1]},
  uplift:{label:'撞墙抬升',unit:'',field:'uplift',cmap:CMAP_STORM,contour:0.2,range:()=>[0,1]},

function decodeGrid(g){
  const f={}, mx={};
  for(const k in g.fields){ const a=g.fields[k]; const q=decode(a);
    if(a.min===undefined){ f[k]=q; continue; }
    const qmax=a.dtype==='uint16'?65535:255; const out=new Float32Array(q.length); const sc=(a.max-a.min)/qmax; for(let i=0;i<q.length;i++) out[i]=a.min+q[i]*sc; f[k]=out; }
  if(f.u&&f.v){ const s=new Float32Array(f.u.length); let m=0; for(let i=0;i<s.length;i++){ s[i]=Math.hypot(f.u[i],f.v[i]); if(s[i]>m) m=s[i]; } f.speed=s; mx.speed=m; }
  return {nlat:g.nlat,nlon:g.nlon,lat0:g.lat0,lon0:g.lon0,res:g.res,band_names:g.band_names,band_local:g.band_local||null,f,max:mx};
}
// 双线性采样（同 sphere.grid_interp：经度周期、纬度夹断）
function gsample(arr,lat,lon){
  const nlat=GR.nlat,nlon=GR.nlon,res=GR.res;
  const fi=(lat-GR.lat0)/res, fj=(lon-GR.lon0)/res;
  const i0=Math.max(0,Math.min(nlat-1,Math.floor(fi))), i1=Math.min(i0+1,nlat-1), ti=Math.max(0,Math.min(1,fi-i0));
  const j0f=Math.floor(fj), tj=fj-j0f, j0=((j0f%nlon)+nlon)%nlon, j1=(j0+1)%nlon;
  return arr[i0*nlon+j0]*(1-ti)*(1-tj)+arr[i0*nlon+j1]*(1-ti)*tj+arr[i1*nlon+j0]*ti*(1-tj)+arr[i1*nlon+j1]*ti*tj;
}
function gread(lat,lon){ // 某点的全部气象读数
  if(!GR) return null; const f=GR.f; const r={}; r.lat=lat; r.lon=lon;
  if(f.u&&f.v){ r.u=gsample(f.u,lat,lon); r.v=gsample(f.v,lat,lon); r.spd=Math.hypot(r.u,r.v); r.toward=(Math.atan2(r.u,r.v)*180/Math.PI+360)%360; r.from=(r.toward+180)%360; }
  if(f.temp) r.temp=gsample(f.temp,lat,lon);
  if(f.precip) r.precip=gsample(f.precip,lat,lon);
  if(f.storm) r.storm=gsample(f.storm,lat,lon);
  if(f.band){ const i=Math.max(0,Math.min(GR.nlat-1,Math.round((lat-GR.lat0)/GR.res))); const j=(((Math.round((lon-GR.lon0)/GR.res))%GR.nlon)+GR.nlon)%GR.nlon; r.band=f.band[i*GR.nlon+j]; }
  return r;
}

function windText(r){ return r.spd===undefined?'':`${compass(r.from)}风 ${fmt(r.spd,1)} m/s（吹向 ${compass(r.toward)} ${Math.round(r.toward)}°）`; }
function metHtml(r){ if(!r) return ''; const parts=[]; const f=GR.f; const lat=r.lat, lon=r.lon;
  if(r.spd!==undefined) parts.push(`风 ${windText(r)} · u ${fmt(r.u,1)} v ${fmt(r.v,1)}`);
  const p2=[]; if(r.temp!==undefined) p2.push(`海面温度 ${fmt(r.temp,1)} °C`); if(r.precip!==undefined) p2.push(`降水 ${fmt(r.precip)}`); if(r.storm!==undefined) p2.push(`风暴 ${fmt(r.storm)}`); if(r.band!==undefined) p2.push(BAND_ZH[GR.band_names[r.band]]||('带 '+r.band));
  if(p2.length) parts.push(p2.join(' · '));
  const p3=[]; if(f.q) p3.push(`水汽 ${fmt(gsample(f.q,lat,lon))}`); if(f.uplift) p3.push(`抬升 ${fmt(gsample(f.uplift,lat,lon))}`); if(f.obstacle) p3.push(`障碍 ${fmt(gsample(f.obstacle,lat,lon))}`); if(f.wake) p3.push(`尾流 ${fmt(gsample(f.wake,lat,lon))}`);
  if(p3.length) parts.push(`<span class="small">${p3.join(' · ')}</span>`);
  return parts.join('<br>'); }

function decode(a){
  const bin = atob(a.b64); const buf = new ArrayBuffer(bin.length); const u8 = new Uint8Array(buf);
  for (let i=0;i<bin.length;i++) u8[i]=bin.charCodeAt(i);
  const T = {float32:Float32Array,uint8:Uint8Array,uint16:Uint16Array,int32:Int32Array,int16:Int16Array,int8:Int8Array}[a.dtype];
  const arr = new T(buf); arr.shape = a.shape; return arr;
}
function viridis(t){ // 近似 viridis
  t = Math.max(0,Math.min(1,t));
  const stops=[[68,1,84],[72,40,120],[62,74,137],[49,104,142],[38,130,142],[31,158,137],[53,183,121],[109,205,89],[180,222,44],[253,231,37]];
  const x=t*(stops.length-1), i=Math.min(stops.length-2,Math.floor(x)), f=x-i;
  const c=stops[i].map((v,k)=>Math.round(v+(stops[i+1][k]-v)*f)); return `rgb(${c[0]},${c[1]},${c[2]})`;
}
function rdylgn(t){ t=Math.max(0,Math.min(1,t)); const r=t<.5?215:Math.round(255-(t-.5)*2*(255-26)); const g=t<.5?Math.round(48+t*2*(220-48)):Math.round(220-(t-.5)*2*(220-150)); const b=t<.5?39:Math.round(20+(t-.5)*2*(80-20)); return `rgb(${r},${g},${b})`; }
function plasma(t){ t=Math.max(0,Math.min(1,t)); const s=[[13,8,135],[126,3,168],[204,71,120],[248,149,64],[240,249,33]]; const x=t*4,i=Math.min(3,Math.floor(x)),f=x-i; const c=s[i].map((v,k)=>Math.round(v+(s[i+1][k]-v)*f)); return `rgb(${c[0]},${c[1]},${c[2]})`; }
function wrap(d){ return ((d+180)%360+360)%360-180; }
function fmt(x,n=2){ return (x===undefined||x===null||isNaN(x))?'—':Number(x).toFixed(n); }
function q(p){ if(p>=.9)return'近乎全部';if(p>=.7)return'约七八成';if(p>=.55)return'约六成';if(p>=.45)return'约半';if(p>=.3)return'约三四成';if(p>=.15)return'约两成';if(p>=.05)return'零星';return'几乎无人'; }

const N = () => W.n_islands;
function fieldRow(kind, ti){ const arr = FA[kind]; const n=N(); return arr.subarray(ti*n, ti*n+n); }
function localShareRow(si){ const n=N(); return FA.local_share.subarray(si*n, si*n+n); }
function slotRowsOf(slot){ return F.slot_rows[slot]; }
// 文化距离（TV 均值，可按模式过滤）
function cultureDistance(h, modeFilter){
  const n=N(); const out=new Float32Array(n); let ns=0;
  W.slots.forEach((slot,si)=>{
    if (modeFilter && modeFilter!=='all' && W.slot_mode[slot]!==modeFilter) return;
    ns++;
    const rows = slotRowsOf(slot);
    const acc = new Float32Array(n);
    for (const ti of rows){ const r=fieldRow('share',ti); const hv=r[h]; for(let j=0;j<n;j++) acc[j]+=Math.abs(r[j]-hv); }
    const l = localShareRow(si); const hv=l[h]; for(let j=0;j<n;j++) acc[j]+=Math.abs(l[j]-hv);
    for(let j=0;j<n;j++) out[j]+=acc[j]/255/2;
  });
  if (ns) for(let j=0;j<n;j++) out[j]/=ns;
  return out;
}
function pairDistance(a,b){ const res={}; for (const m of ['all',...MODES]){ let s=0,ns=0; W.slots.forEach((slot,si)=>{ if(m!=='all'&&W.slot_mode[slot]!==m)return; ns++; let tv=0; for(const ti of slotRowsOf(slot)){const r=fieldRow('share',ti); tv+=Math.abs(r[a]-r[b]);} const l=localShareRow(si); tv+=Math.abs(l[a]-l[b]); s+=tv/255/2;}); res[m]=ns?s/ns:NaN;} return res; }

// 面积/容量跨三个数量级：着色用 log 归一，点半径用 sqrt 并在 p2/p98 处夹断。
const normCache={};
function logNorm(key, arr){
  if (normCache[key]) return normCache[key];
  const n=arr.length; const out=new Float32Array(n);
  let mn=Infinity, mx=-Infinity;
  for(let i=0;i<n;i++){ const v=Math.log(Math.max(arr[i],1e-9)); out[i]=v; if(v<mn)mn=v; if(v>mx)mx=v; }
  const d=Math.max(1e-9,mx-mn);
  for(let i=0;i<n;i++) out[i]=(out[i]-mn)/d;
  return normCache[key]=out;
}
function areaRadius(){
  if (normCache.__r) return normCache.__r;
  const n=N(); const s=new Float64Array(n);
  for(let i=0;i<n;i++) s[i]=Math.sqrt(Math.max(A.area[i],1e-9));
  const sorted=Float64Array.from(s).sort();
  const lo=sorted[Math.floor(0.02*(n-1))], hi=sorted[Math.floor(0.98*(n-1))];
  const out=new Float32Array(n); const d=Math.max(1e-9,hi-lo);
  for(let i=0;i<n;i++) out[i]=0.07+0.40*Math.max(0,Math.min(1,(s[i]-lo)/d));
  return normCache.__r=out;
}

// ------------------------------------------------------------ 风向流线（客户端积分 u/v；虚线沿风向流动，密度随视高自适应）

// ------------------------------------------------------------ 航线的顺逆风（复现 s06：边中点风向 × 初始方位角 → dir(c)^α）
function xyzOf(lat,lon){ const p=lat*Math.PI/180,l=lon*Math.PI/180; return [Math.cos(p)*Math.cos(l),Math.cos(p)*Math.sin(l),Math.sin(p)]; }
function bearingDeg(lat1,lon1,lat2,lon2){ const p1=lat1*Math.PI/180,p2=lat2*Math.PI/180,dl=(lon2-lon1)*Math.PI/180; const y=Math.sin(dl)*Math.cos(p2), x=Math.cos(p1)*Math.sin(p2)-Math.sin(p1)*Math.cos(p2)*Math.cos(dl); return Math.atan2(y,x)*180/Math.PI; }
function findEdge(a,b){ for(let e=0;e<W.n_edges;e++){ if((A.e_src[e]===a&&A.e_dst[e]===b)||(A.e_src[e]===b&&A.e_dst[e]===a)) return e; } return -1; }
function edgeWindCos(a,b,e){ // a→b：cos(风向 − 航向)。采样点与 s06 完全一致：沿无向边 src→dst 大圆的第 ⌊n/2⌋ 个采样点，两个方向共用；
  if(!GR||!GR.f.u) return null;                                  // 不给 e 时按 a→b 取（用于没有边索引的场合）
  let s=a, d=b; if(e!==undefined&&e>=0){ s=A.e_src[e]; d=A.e_dst[e]; }
  const P=xyzOf(A.lat[s],A.lon[s]), Q=xyzOf(A.lat[d],A.lon[d]);
  const ns=+((cfg.s06&&cfg.s06.routes&&cfg.s06.routes.edge_samples)||8); const t=Math.floor(ns/2)/(ns-1);
  const om=Math.acos(Math.max(-1,Math.min(1,P[0]*Q[0]+P[1]*Q[1]+P[2]*Q[2]))); const so=Math.sin(om);
  const wa=so>1e-9?Math.sin((1-t)*om)/so:1-t, wb=so>1e-9?Math.sin(t*om)/so:t;
  const m=[wa*P[0]+wb*Q[0],wa*P[1]+wb*Q[1],wa*P[2]+wb*Q[2]]; const n=Math.hypot(m[0],m[1],m[2]);
  const mlat=Math.asin(m[2]/n)*180/Math.PI, mlon=Math.atan2(m[1],m[0])*180/Math.PI;
  const u=gsample(GR.f.u,mlat,mlon), v=gsample(GR.f.v,mlat,mlon); const wdir=Math.atan2(u,v)*180/Math.PI;
  const brg=bearingDeg(mlat,mlon,A.lat[b],A.lon[b]);
  return {c:Math.cos((wdir-brg)*Math.PI/180), spd:Math.hypot(u,v)};
}
function dirFactor(c){ const r=cfg.s06.routes; const tail=+r.tailwind_factor, head=+r.headwind_factor; return c>=0?1/(1+(1/tail-1)*c):1+(head-1)*(-c); }
function windFactor(a,b,mode,e){ const w=edgeWindCos(a,b,e); if(!w) return null; return Math.pow(dirFactor(w.c),+cfg.s06.routes.alpha[mode]); }
function windFacText(f){ if(f===null||f===undefined) return '—'; const tag=f<0.97?'顺':(f>1.03?'逆':'横'); const cls=f<0.97?'mode-envoy':(f>1.03?'mode-migrate':''); return `<span class="${cls}">${tag} ×${fmt(f)}</span>`; }

}
function nearest(lat,lng){
  const n=N(); let best=-1,bd=1e9; const la=lat*Math.PI/180, lo=lng*Math.PI/180; const cl=Math.cos(la);
  for(let i=0;i<n;i++){ const dl=wrap(A.lon[i]-lng)*Math.PI/180; const dphi=(A.lat[i]-lat)*Math.PI/180; const d=dphi*dphi+cl*cl*dl*dl; if(d<bd){bd=d;best=i;} }
  return Math.sqrt(bd)*180/Math.PI < 2.5 ? best : -1;
}

function mdToHtml(md){
  const lines=md.split('\n'); let out=[]; let inTable=false, inList=false;
  const inline=s=>s.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/【(.+?)】/g,'<span class="pill">$1</span>');
  for (let ln of lines){
    if (/^\|/.test(ln)){ if(/^\|\s*-+/.test(ln)) continue; if(!inTable){out.push('<table>');inTable=true;} const cells=ln.split('|').slice(1,-1); out.push('<tr>'+cells.map(c=>`<td>${inline(c.trim())}</td>`).join('')+'</tr>'); continue; }
    else if (inTable){ out.push('</table>'); inTable=false; }
    if (/^\s*[·\-] /.test(ln)){ if(!inList){out.push('<ul>');inList=true;} out.push('<li>'+inline(ln.replace(/^\s*[·\-] /,''))+'</li>'); continue; }
    else if (inList){ out.push('</ul>'); inList=false; }
    if (/^# /.test(ln)) out.push('<h1>'+inline(ln.slice(2))+'</h1>');
    else if (/^## /.test(ln)) out.push('<h2>'+inline(ln.slice(3))+'</h2>');
    else if (/^> /.test(ln)) out.push('<blockquote>'+inline(ln.slice(2))+'</blockquote>');
    else if (ln.trim()==='') continue;
    else out.push('<p>'+inline(ln)+'</p>');
  }
  if(inTable) out.push('</table>'); if(inList) out.push('</ul>');
  return out.join('\n');
}

function collectSets(){
  const sets=[]; const pairs={};
  document.querySelectorAll('#tab-params input[data-key]').forEach(inp=>{
    if (inp.value===inp.dataset.orig) return;
    if (inp.dataset.idx!==undefined){ const k=inp.dataset.key; pairs[k]=pairs[k]||getPath(cfg,k).slice(); pairs[k][+inp.dataset.idx]=+inp.value; }
    else sets.push(`${inp.dataset.key}=${inp.value}`);
  });
  for (const k in pairs) sets.push(`${k}=[${pairs[k].join(',')}]`);
  return sets;
}

  const j=await r.json(); if(j.error){ $('log').textContent+='错误：'+j.error; $('btnRun').disabled=false; return; }

    const s=await (await api('/api/run/status')).json();
    $('log').textContent=s.log.join('\n'); $('log').scrollTop=1e9;
    if(!s.running){ clearInterval(timer); $('btnRun').disabled=false;

      await loadRunList(); $('runsel').value=s.done_run; await loadRun(s.done_run); showTab('dev'); $('foldCheck').open=true; }
