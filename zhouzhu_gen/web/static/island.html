<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>州渚 · 岛群调试台</title>
<!-- 完全离线。数据：/api/island/data（island.json + climate.json 含逐日天气）、/api/island/raster（terrain.npz 的定型数组） -->
<style>
:root{--bg:#0b0e14;--panel:#141922;--line:#26303f;--ink:#e6e9ef;--dim:#8a94a6;--acc:#f0b35a;--acc2:#5aa9f0;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font:13px/1.45 "Microsoft YaHei","PingFang SC","Noto Sans CJK SC",system-ui,sans-serif;font-variant-numeric:tabular-nums}
#app{display:grid;grid-template-rows:44px 1fr 26px;grid-template-columns:250px 1fr 420px;height:100%}
header{grid-column:1/4;display:flex;align-items:center;gap:12px;padding:0 12px;background:var(--panel);border-bottom:1px solid var(--line)}
header h1{font-size:15px;margin:0;font-weight:600;letter-spacing:.5px;font-family:"Source Han Serif SC","Noto Serif CJK SC","SimSun",serif}
header .sp{flex:1}
header input,header button,header select{background:#0f131a;color:var(--ink);border:1px solid var(--line);border-radius:4px;padding:4px 8px;font:inherit}
button{cursor:pointer}
button.primary{background:var(--acc);color:#1b1408;border-color:var(--acc);font-weight:600}
button:disabled{opacity:.45;cursor:default}
aside{background:var(--panel);overflow:auto;padding:10px 12px;border-right:1px solid var(--line)}
aside.right{border-right:0;border-left:1px solid var(--line)}
#mapWrap{position:relative;overflow:hidden;background:#05070d}
#map{position:absolute;left:0;top:0;width:100%;height:100%;display:block;cursor:crosshair}
#fx{position:absolute;left:0;top:0;width:100%;height:100%;display:block;pointer-events:none}
footer{grid-column:1/4;display:flex;align-items:center;gap:16px;padding:0 12px;background:var(--panel);border-top:1px solid var(--line);color:var(--dim);font-size:12px;white-space:nowrap;overflow:hidden}
.sec{margin-bottom:14px}
.sec h3{font-size:12px;color:var(--dim);margin:0 0 6px;text-transform:uppercase;letter-spacing:.8px;font-weight:600}
.row{display:flex;align-items:center;gap:8px;margin:4px 0;flex-wrap:wrap}
.row label{min-width:56px;color:var(--dim)}
.row select,.row input[type=number],.row input[type=text]{flex:1;min-width:0;background:#0f131a;color:var(--ink);border:1px solid var(--line);border-radius:4px;padding:3px 6px;font:inherit}
.row input[type=range]{flex:1}
.chk{display:flex;align-items:center;gap:6px;margin:3px 0;cursor:pointer}
table.kv{border-collapse:collapse;width:100%;font-size:12px}
table.kv td,table.kv th{padding:2px 4px;border-bottom:1px solid #1d2430;vertical-align:top;text-align:left}
table.kv td:first-child{color:var(--dim);white-space:nowrap}
table.kv th{color:var(--dim);font-weight:600}
.pill{display:inline-block;padding:1px 7px;border-radius:10px;font-size:11px;background:#1f2937;color:var(--ink);margin:1px 2px;white-space:nowrap}
.small{font-size:11px;color:var(--dim)}
.btnrow{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.btnrow button{background:#1f2937;color:var(--ink);border:1px solid var(--line);border-radius:4px;padding:4px 9px;font:inherit}
button.mini{background:#1f2937;color:var(--ink);border:1px solid var(--line);border-radius:3px;padding:0 5px;font:inherit;font-size:11px}
#tip{position:absolute;pointer-events:none;background:rgba(10,13,20,.92);border:1px solid var(--line);padding:5px 8px;border-radius:4px;font-size:12px;display:none;z-index:5;max-width:300px}
#loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--dim);font-size:14px;background:rgba(5,7,13,.85);z-index:6}
details.fold{border-top:1px solid var(--line);padding-top:6px;margin:8px 0}
details>summary{cursor:pointer;color:var(--dim);font-size:12px;letter-spacing:.8px;font-weight:600;list-style:none;user-select:none}
details>summary::before{content:'▸ ';display:inline-block;width:12px}
details[open]>summary::before{content:'▾ '}
canvas.chart{width:100%;display:block;background:#0f131a;border:1px solid var(--line);border-radius:4px}
#dayCard{background:#0f131a;border:1px solid var(--line);border-radius:4px;padding:6px 8px;margin:6px 0}
#dayCard b{font-size:15px}
textarea{width:100%;min-height:64px;background:#0f131a;color:var(--ink);border:1px solid var(--line);border-radius:4px;font:12px Consolas,monospace;padding:4px}
.legend{display:flex;flex-wrap:wrap;gap:4px 8px;font-size:11px;color:var(--dim);margin-top:4px}
.sw{display:inline-block;width:10px;height:10px;border-radius:2px;vertical-align:middle;margin-right:3px}
a{color:var(--acc2)}
#islandList button{display:inline-block;margin:1px;padding:0 5px}
</style>
</head>
<body>
<div id="app">
<header>
  <h1>州渚 · 岛群调试台</h1>
  <span class="small" id="hdr"></span>
  <span class="sp"></span>
  <label class="small">run</label><input id="runIn" type="text" size="9">
  <label class="small">节点</label><input id="nodeIn" type="number" style="width:80px">
  <button id="btnGo">打开</button>
  <a href="/" id="backLink" class="small" style="margin-left:8px" title="回到行星操作台并选中这个岛">← 行星操作台（选中此岛）</a>
</header>

<aside>
  <div class="sec"><h3>图层</h3>
    <div class="row"><label>底图</label><select id="baseSel">
      <option value="terrain">地形（晕渲 + 高程色）</option>
      <option value="hill">纯晕渲</option>
      <option value="landcover">地表分类</option>
      <option value="slope">坡度</option>
      <option value="flowacc">汇流面积（log）</option>
      <option value="island">岛号</option>
      <option value="temp">当日海拔温度</option>
    </select></div>
    <label class="chk"><input type="checkbox" id="ovWater" checked> 河 / 溪涧 / 湖</label>
    <label class="chk"><input type="checkbox" id="ovArable" checked> 可耕地 / 梯田轮廓</label>
    <label class="chk"><input type="checkbox" id="ovCliff"> 崖缘</label>
    <label class="chk"><input type="checkbox" id="ovLinks" checked> 索桥 / 短渡 / 导水槽</label>
    <label class="chk"><input type="checkbox" id="ovLabels" checked> 岛号标签</label>
    <label class="chk"><input type="checkbox" id="ovContour"> 等高线（100 m）</label>
    <label class="chk" title="随日期变化：积雪与雪线、植被枯荣与作物、溪涧断流 / 河道涨水漫滩 / 结冰、云海漫顶"><input type="checkbox" id="ovLive" checked> 季相与水情（随日期变）</label>
    <label class="chk" title="雨丝 / 雪花 / 风暴 / 多云 / 云雾 / 风的粒子"><input type="checkbox" id="ovFx" checked> 天气特效</label>
    <div class="row"><label>夸张</label><input type="range" id="exag" min="1" max="12" step="0.5" value="4"><span id="exagV" class="small">4</span></div>
    <div id="legend" class="legend"></div>
  </div>
  <div class="sec"><h3>岛</h3>
    <div id="islandList" class="small"></div>
    <div class="btnrow"><button id="btnFit">全群</button><button id="btnMain">主岛</button></div>
  </div>
  <div class="sec"><h3>约束对照</h3><table class="kv" id="cons"></table></div>
  <div class="sec"><h3>水系 / 地表</h3><table class="kv" id="hydro"></table></div>
  <div class="sec small">滚轮缩放，拖动平移，悬停读格子。</div>
</aside>

<div id="mapWrap">
  <canvas id="map"></canvas>
  <canvas id="fx"></canvas>
  <div id="tip"></div>
  <div id="loading">加载中…</div>
</div>

<aside class="right">
  <div class="sec"><h3>气候：<span id="stype"></span></h3>
    <div id="climSum" class="small"></div>
    <table class="kv" id="seasons"></table>
    <canvas class="chart" id="seasonChart" height="150"></canvas>
  </div>
  <div class="sec"><h3>逐日天气</h3>
    <div class="row"><label>年份</label><input type="number" id="yearIn" value="0" style="max-width:90px"><button id="btnYear" class="mini">生成该年</button><span id="wsum" class="small"></span></div>
    <canvas class="chart" id="dayChart" height="170"></canvas>
    <div class="row"><input type="range" id="daySl" min="0" max="335" value="0"><button id="btnPlay" class="mini">▶</button><select id="speed" style="max-width:70px"><option value="8">8 d/s</option><option value="24" selected>24 d/s</option><option value="84">84 d/s</option></select></div>
    <div id="dayCard"></div>
    <div id="dayState" class="small"></div>
    <table class="kv" id="wseasons"></table>
  </div>
  <details class="fold"><summary>参数覆盖与重新生成</summary>
    <div class="small">每行一条 <code>island.a.b=value</code>，只影响本次生成（不写配置）；留空即按默认重生成。</div>
    <textarea id="sets" placeholder="island.terrain.fluvial_k=0.03&#10;island.layout.gap_max_km=8"></textarea>
    <div class="btnrow"><button id="btnRegen" class="primary">重新生成</button><button id="btnDefaults" class="mini">看当前参数</button></div>
    <pre id="cfgBox" class="small" style="display:none;white-space:pre-wrap;max-height:260px;overflow:auto"></pre>
  </details>
  <details class="fold"><summary>产物</summary><div id="files" class="small"></div></details>
</aside>

<footer><span id="status">就绪</span><span class="sp"></span><span id="coords"></span></footer>
</div>

<script>
const $ = id => document.getElementById(id);
const fmt = (x, n = 1) => (x === undefined || x === null || isNaN(x)) ? '—' : Number(x).toFixed(n);
const q = new URLSearchParams(location.search);
let run = q.get('run') || 'seed42', node = +(q.get('node') || 0), year = +(q.get('year') || 0);
let D = null, R = null;            // 数据包 / 栅格
let base = null;                   // 底图 ImageData 缓存（按图层）
let view = { s: 1, tx: 0, ty: 0 };  // 屏幕 = 格 × s + t
let day = 0, playing = false, playTimer = null;
const LC_NAMES = ["虚空","崖缘","裸岩","高山草甸","林地","灌丛","草坡","可耕地","梯田","湿地","河道","湖"];
const LC_PAL = [[20,24,40],[90,80,75],[150,150,150],[170,200,120],[40,110,50],[120,150,70],[190,200,110],[230,200,90],[210,170,60],[90,160,150],[40,90,200],[30,60,170]];
const TYPE_COLORS = {"晴":"#f7d76b","多云":"#c8ccd2","小雨":"#8fb8de","大雨":"#3b6fb6","云海漫顶":"#e6e1f2","风暴":"#7a2d8c","小雪":"#dfe8f5","大雪":"#b7c6dc","暴风雪":"#5a4a8c"};
const isStorm = t => t === '风暴' || t === '暴风雪', isSnow = t => t === '小雪' || t === '大雪' || t === '暴风雪', isWet = t => t === '小雨' || t === '大雨' || isSnow(t) || isStorm(t);
const ISL_COLORS = ['#e6550d','#3182bd','#31a354','#756bb1','#636363','#e6ab02','#a6761d','#1b9e77','#d95f02','#7570b3','#e7298a','#66a61e'];
function setStatus(s){ $('status').textContent = s; }
function b64(s, T){ const bin = atob(s); const u8 = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i); return new T(u8.buffer); }

// ------------------------------------------------------------ 加载
async function load(force = false, sets = null){
  $('loading').style.display = 'flex'; setStatus('加载…');
  try {
    let d;
    if (sets !== null) {
      const r = await fetch('/api/island/regen', { method: 'POST', body: JSON.stringify({ run, node, year, sets }) });
      d = await r.json();
    } else {
      d = await (await fetch(`/api/island/data?run=${run}&node=${node}&year=${year}${force ? '&force=1' : ''}`)).json();
    }
    if (d.error) { setStatus('出错：' + d.error); $('loading').textContent = '出错：' + d.error + (d.trace ? '\n' + d.trace : ''); return; }
    D = d;
    const rr = await (await fetch(`/api/island/raster?run=${run}&node=${node}&t=${Date.now()}`)).json();
    R = { rows: rr.rows, cols: rr.cols, step: rr.step,
      h: b64(rr.height_u16, Uint16Array), id: b64(rr.island_id_i16, Int16Array),
      lc: rr.landcover_u8 ? b64(rr.landcover_u8, Uint8Array) : null, river: rr.river_u8 ? b64(rr.river_u8, Uint8Array) : null,
      stream: rr.stream_u8 ? b64(rr.stream_u8, Uint8Array) : null, lake: rr.lake_u8 ? b64(rr.lake_u8, Uint8Array) : null,
      arable: rr.arable_u8 ? b64(rr.arable_u8, Uint8Array) : null, cliff: rr.cliff_u8 ? b64(rr.cliff_u8, Uint8Array) : null,
      slope: rr.slope_u8 ? b64(rr.slope_u8, Uint8Array) : null, fa: rr.flowacc_log_u8 ? b64(rr.flowacc_log_u8, Uint8Array) : null };
    R.res_m = D.island.raster.res_m * R.step;
    history.replaceState(null, '', `?run=${run}&node=${node}&year=${year}`);
    base = null; dayLayer = null; dayTab = null; day = Math.min(day, 335);
    renderSide(); buildDayTables(); fitView(); draw(); renderClimate(); renderWeather();
    setStatus(`就绪：${run} #${node} · ${R.rows}×${R.cols} @ ${R.res_m} m${R.step > 1 ? '（抽稀 ' + R.step + '×）' : ''} · 生成 ${D.island.meta.seconds} s`);
  } catch (e) { setStatus('出错：' + e); console.error(e); }
  $('loading').style.display = 'none';
}

// ------------------------------------------------------------ 侧栏
function renderSide(){
  const J = D.island, m = J.meta, c = J.constraints;
  $('hdr').textContent = `#${node}（${fmt(m.lat, 1)}°, ${fmt(m.lon, 1)}°）${m.cls_zh} · ${m.age_zh} · 板块${m.boundary_type}带 · ${J.islands.length} 岛`;
  $('runIn').value = run; $('nodeIn').value = node; $('yearIn').value = year;
  const back = q.get('back') || ''; const lensPart = (back.match(/lens=(\w+)/) || [])[1];
  $('backLink').href = `/#${lensPart ? 'lens=' + lensPart + '&' : ''}run=${run}&node=${node}`;
  const row = (k, t, a, rel) => `<tr><td>${k}</td><td>${fmt(t, 3)}</td><td>${fmt(a, 3)}</td><td class="small">${rel}</td></tr>`;
  $('cons').innerHTML = `<tr><th>量</th><th>行星层</th><th>实际</th><th>误差</th></tr>`
    + row('陆地 km²', c.area_km2.target, c.area_km2.actual, fmt(Math.abs(c.area_km2.actual - c.area_km2.target) / c.area_km2.target * 100, 2) + '%')
    + row('主岛 km²', c.main_area_km2.target, c.main_area_km2.actual, fmt(Math.abs(c.main_area_km2.actual - c.main_area_km2.target) / c.main_area_km2.target * 100, 2) + '%')
    + row('峰高 m', c.height_m.target, c.height_m.actual, fmt(Math.abs(c.height_m.actual - c.height_m.target), 1) + ' m')
    + row('可耕率', c.arable_frac.target, c.arable_frac.actual, fmt(Math.abs(c.arable_frac.actual - c.arable_frac.target), 4))
    + `<tr><td>常年河</td><td>${c.has_river.target ? '有' : '无'}</td><td>${c.has_river.actual ? '有' : '无'}</td><td class="small">${c.has_river.target === c.has_river.actual ? '一致' : '不一致'}</td></tr>`;
  const hy = J.hydro || {}, lc = (J.landcover || {}).share || {};
  const lcs = Object.entries(lc).filter(([k, v]) => v > 0.002).sort((a, b) => b[1] - a[1]).map(([k, v]) => `<span class="pill"><span class="sw" style="background:rgb(${LC_PAL[LC_NAMES.indexOf(k)].join(',')})"></span>${k} ${fmt(v * 100, 1)}%</span>`).join('');
  $('hydro').innerHTML = `<tr><td>降水</td><td>${fmt(hy.precip_mm, 0)} mm/年</td></tr><tr><td>河阈值</td><td>${hy.river_threshold_km2 ?? '—'} km²（主岛最大汇流 ${fmt(hy.main_max_flowacc_km2, 0)}）</td></tr>
    <tr><td>湖</td><td>${hy.n_lakes} 个 · ${fmt(hy.lake_km2, 2)} km²</td></tr><tr><td>盆地</td><td>${hy.main_basins ? hy.main_basins.n_basins + ' 个，大盆地 ' + hy.main_basins.n_large + '（最大占 ' + fmt(hy.main_basins.largest_frac * 100, 0) + '%）' : '—'}</td></tr>
    <tr><td>索桥/短渡</td><td>${J.layout.n_bridges} / ${J.layout.n_ferries}，导水槽联通 ${J.layout.channel_islands} 岛，岸距中位 ${J.layout.gap_median_km} km</td></tr><tr><td>地表</td><td>${lcs}</td></tr>`;
  $('islandList').innerHTML = J.islands.map(i => `<button class="mini" data-i="${i.id}" title="${i.area_km2} km² · 峰 ${i.peak_m} m · 岸缘 ${i.rim_m} m · ${i.age_zh}${i.n_lakes ? ' · 湖 ' + i.n_lakes : ''}${i.has_perennial_river ? ' · 有河' : ''}">${i.id}</button>`).join('');
  $('islandList').querySelectorAll('button').forEach(b => b.onclick = () => zoomIsland(+b.dataset.i));
  const f = `/api/island/preview?run=${run}&node=${node}`;
  $('files').innerHTML = `<div>${D.island.meta.run}/islands/${node}/：island.json · height.png · landcover.png · water.png · arable.png · terrain.npz · climate.json · weather_y${year}.csv</div>
    <div><a href="${D.preview}" target="_blank">preview.png</a> · <a href="${D.preview_main}" target="_blank">preview_main.png</a></div>`;
}

// ------------------------------------------------------------ 地图
function cellXY(kmx, kmy){ const r = D.island.raster; return [(kmx - r.origin_km[0]) * 1000 / R.res_m, (r.origin_km[1] - kmy) * 1000 / R.res_m]; }
function fitView(){
  const cv = $('map'); const W = cv.clientWidth, H = cv.clientHeight;
  const s = Math.min(W / R.cols, H / R.rows) * 0.96;
  view = { s, tx: (W - R.cols * s) / 2, ty: (H - R.rows * s) / 2 };
}
function zoomIsland(i){
  const isl = D.island.islands[i]; const [bx, by, m] = isl.bbox_cells; const cv = $('map');
  const cells = m / R.step; const s = Math.min(cv.clientWidth, cv.clientHeight) / cells * 0.9;
  const cx = (isl.center_km[0] - D.island.raster.origin_km[0]) * 1000 / R.res_m, cy = (D.island.raster.origin_km[1] - isl.center_km[1]) * 1000 / R.res_m;
  view = { s, tx: cv.clientWidth / 2 - cx * s, ty: cv.clientHeight / 2 - cy * s }; draw();
}
function hillshade(){
  const { rows, cols, h } = R; const out = new Float32Array(rows * cols);
  const ex = +$('exag').value; const res = R.res_m;
  // 自适应：让坡度 P90 约 30° 再乘手动夸张
  let g = []; for (let k = 0; k < 4000; k++) { const i = 1 + (Math.random() * (rows - 2)) | 0, j = 1 + (Math.random() * (cols - 2)) | 0; const p = i * cols + j; if (!h[p] || !h[p - 1] || !h[p + 1] || !h[p - cols] || !h[p + cols]) continue; g.push(Math.hypot((h[p + 1] - h[p - 1]) / (2 * res), (h[p + cols] - h[p - cols]) / (2 * res))); }
  g.sort((a, b) => a - b); const p90 = g.length ? g[(g.length * 0.9) | 0] : 0.1; const auto = Math.min(40, Math.max(1, 0.577 / Math.max(p90, 1e-6)));
  const k = auto * ex / 4; const lx = -0.5, ly = -0.5, lz = 0.707;
  for (let i = 0; i < rows; i++) for (let j = 0; j < cols; j++) {
    const p = i * cols + j; if (!h[p]) continue;
    const hl = h[Math.max(0, p - 1)] || h[p], hr = h[Math.min(rows * cols - 1, p + 1)] || h[p], hu = h[Math.max(0, p - cols)] || h[p], hd = h[Math.min(rows * cols - 1, p + cols)] || h[p];
    const dx = (hr - hl) / (2 * res) * k, dy = (hd - hu) / (2 * res) * k;
    const n = 1 / Math.sqrt(dx * dx + dy * dy + 1); out[p] = Math.max(0, (-dx * lx - dy * ly + lz) * n);
  }
  return out;
}
function terrainColor(t){ // 0..1 → 类 gist_earth
  const stops = [[0,[38,72,120]],[0.15,[60,120,110]],[0.35,[90,160,90]],[0.55,[170,180,90]],[0.75,[190,150,100]],[0.9,[230,225,215]],[1,[255,255,255]]];
  let a = stops[0], b = stops[stops.length - 1]; for (let i = 0; i < stops.length - 1; i++) if (t >= stops[i][0] && t <= stops[i + 1][0]) { a = stops[i]; b = stops[i + 1]; break; }
  const u = (t - a[0]) / Math.max(1e-9, b[0] - a[0]); return [0, 1, 2].map(c => a[1][c] + (b[1][c] - a[1][c]) * u);
}
function viridis(t){ const s = [[68,1,84],[59,82,139],[33,145,140],[94,201,98],[253,231,37]]; t = Math.max(0, Math.min(1, t)) * 4; const i = Math.min(3, t | 0), u = t - i; return [0,1,2].map(c => s[i][c] + (s[i+1][c] - s[i][c]) * u); }
function buildBase(){
  const { rows, cols, h, id } = R; const img = new ImageData(cols, rows); const d = img.data; const mode = $('baseSel').value;

    ctx.strokeStyle = snowing ? 'rgba(255,255,255,0.85)' : (storm ? 'rgba(200,215,255,0.55)' : 'rgba(170,200,255,0.45)'); ctx.lineWidth = snowing ? 2 : 1; ctx.beginPath();
    const fall = snowing ? 60 : (storm ? 900 : 550);
    for (const q of particles) { const dx = vx * (snowing ? 0.4 : 1), dy = fall + vy; q.x += dx * dt; q.y += dy * dt; if (q.y > H || q.x < -20 || q.x > W + 20) { q.x = Math.random() * W; q.y = -10; } if (snowing) { ctx.moveTo(q.x, q.y); ctx.lineTo(q.x + 1.5, q.y + 1.5); } else { ctx.moveTo(q.x, q.y); ctx.lineTo(q.x - dx * 0.02, q.y - dy * 0.02); } }
    ctx.stroke();
  } else if (want) {
    ctx.strokeStyle = 'rgba(255,255,255,0.22)'; ctx.lineWidth = 1; ctx.beginPath();
    for (const q of particles) { q.x += vx * dt; q.y += vy * dt; q.l += dt; if (q.x < -20 || q.x > W + 20 || q.y < -20 || q.y > H + 20 || q.l > 3) { q.x = Math.random() * W; q.y = Math.random() * H; q.l = 0; } const a = Math.sin(Math.min(1, q.l / 3) * Math.PI); ctx.globalAlpha = a; ctx.moveTo(q.x, q.y); ctx.lineTo(q.x - vx * 0.12, q.y - vy * 0.12); }
    ctx.stroke(); ctx.globalAlpha = 1;
  }
  if (w.type === '云海漫顶') {
    while (fogBlobs.length < 14) fogBlobs.push({ x: Math.random() * W, y: Math.random() * H, r: 80 + Math.random() * 160, s: 0.3 + Math.random() * 0.7 });
    for (const b of fogBlobs) { b.x += (wx * 3 + 4) * dt * b.s; b.y += wy * 3 * dt * b.s; if (b.x - b.r > W) b.x = -b.r; if (b.y - b.r > H) b.y = -b.r; if (b.y + b.r < 0) b.y = H + b.r; const g = ctx.createRadialGradient(b.x, b.y, 0, b.x, b.y, b.r); g.addColorStop(0, 'rgba(235,235,245,0.35)'); g.addColorStop(1, 'rgba(235,235,245,0)'); ctx.fillStyle = g; ctx.fillRect(b.x - b.r, b.y - b.r, 2 * b.r, 2 * b.r); }
  } else fogBlobs.length = 0;
  // 风向风速角标
  ctx.save(); ctx.translate(W - 46, 46); ctx.rotate(to); ctx.strokeStyle = 'rgba(255,255,255,0.8)'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(0, 18); ctx.lineTo(0, -18); ctx.lineTo(-6, -10); ctx.moveTo(0, -18); ctx.lineTo(6, -10); ctx.stroke(); ctx.restore();
  ctx.fillStyle = 'rgba(255,255,255,0.85)'; ctx.font = '11px sans-serif'; ctx.textAlign = 'center'; ctx.fillText(`${w.type} · ${fmt(w.wind_ms, 0)} m/s`, W - 46, 78);
}

// ------------------------------------------------------------ 气候
function renderClimate(){
  const C = D.climate; $('stype').textContent = `${C.season_type_zh}（全年温差 ${fmt(C.annual.season_range_c, 1)} °C）`;
  const th = C.thermal;
  $('climSum').textContent = `年均 ${fmt(C.annual.temp_c, 1)} °C（海面 ${fmt(C.annual.temp_sea_c, 1)}）· 冬 ${fmt(C.annual.temp_winter_c, 1)} / 夏 ${fmt(C.annual.temp_summer_c, 1)} · 降水 ${fmt(C.annual.precip_mm, 0)} mm · 风暴 ${fmt(C.annual.storm, 2)} · 窗口 ${fmt(C.annual.window, 2)} · 陆地性 ${fmt(th.continentality_island, 2)}（τ ${fmt(th.tau_island_days, 0)} 日，滞后 ${fmt(th.lag_island_days, 0)} 日）· 带界摆幅 ±${fmt(th.band_shift_amp_deg, 1)}°`;
  $('seasons').innerHTML = `<tr><th>季</th><th>日</th><th>°C 岛/海</th><th>mm</th><th>风暴</th><th>窗口</th><th>风</th><th>Δφ</th></tr>` + C.seasons.map(s => `<tr><td>${s.name}</td><td>${s.days[0]}–${s.days[1]}</td><td>${fmt(s.temp_c, 1)} / ${fmt(s.temp_sea_c, 1)}</td><td>${fmt(s.precip_mm, 0)}</td><td>${fmt(s.storm, 2)}</td><td>${fmt(s.window, 2)}</td><td>${fmt(s.wind.speed_ms, 0)} m/s 自 ${fmt(s.wind.from_deg, 0)}°</td><td>${fmt(s.band_shift_deg, 1)}°</td></tr>`).join('');
  const cv = $('seasonChart'); cv.width = cv.clientWidth; const ctx = cv.getContext('2d'); const W = cv.width, H = cv.height; ctx.clearRect(0, 0, W, H);
  const n = C.seasons.length; const pm = Math.max(...C.seasons.map(s => s.precip_mm)) || 1; const ts = C.seasons.map(s => s.temp_c); const tmin = Math.min(...ts, 0), tmax = Math.max(...ts, 1);
  for (let k = 0; k < n; k++) { const s = C.seasons[k]; const x0 = 30 + k * (W - 40) / n; const bw = (W - 40) / n * 0.5; const bh = s.precip_mm / pm * (H - 40); ctx.fillStyle = '#4c72b0'; ctx.fillRect(x0 + bw * 0.5, H - 20 - bh, bw, bh); ctx.fillStyle = '#8a94a6'; ctx.font = '11px sans-serif'; ctx.textAlign = 'center'; ctx.fillText(s.name, x0 + bw, H - 6); ctx.fillText(fmt(s.precip_mm, 0) + ' mm', x0 + bw, H - 24 - bh); }
  ctx.strokeStyle = '#c44e52'; ctx.lineWidth = 2; ctx.beginPath();
  for (let k = 0; k < n; k++) { const x = 30 + (k + 0.5) * (W - 40) / n; const y = 12 + (1 - (ts[k] - tmin) / (tmax - tmin)) * (H - 50); k ? ctx.lineTo(x, y) : ctx.moveTo(x, y); }
  ctx.stroke(); ctx.fillStyle = '#c44e52'; ctx.textAlign = 'center';
  for (let k = 0; k < n; k++) { const x = 30 + (k + 0.5) * (W - 40) / n; const y = 12 + (1 - (ts[k] - tmin) / (tmax - tmin)) * (H - 50); ctx.beginPath(); ctx.arc(x, y, 3, 0, 7); ctx.fill(); ctx.fillText(fmt(ts[k], 1) + '°', x + 22, y - 2); }
}

// ------------------------------------------------------------ 逐日天气
function renderWeather(){
  const Wt = D.climate.weather; if (!Wt || !Wt.days) { $('wsum').textContent = '（无逐日天气）'; return; }
  const days = Wt.days; $('daySl').max = days.length - 1;
  $('wsum').textContent = `y${Wt.year}：雨 ${fmt(Wt.precip_mm, 0)} mm（气候 ${fmt(Wt.precip_climate_mm, 0)}），风暴 ${Wt.storm_events} 场，可出航 ${Wt.sailable_days} 天`;
  $('wseasons').innerHTML = `<tr><th>季</th><th>雨日</th><th>雪日</th><th>风暴日/场</th><th>雾</th><th>可出航</th><th>mm 实/候</th><th>均温</th></tr>` + Wt.seasons.map(s => `<tr><td>${s.name}</td><td>${s.rain_days}</td><td>${s.snow_days ?? 0}</td><td>${s.storm_days}/${s.storm_events}</td><td>${s.fog_days}</td><td>${s.sailable_days}</td><td>${fmt(s.precip_mm, 0)}/${fmt(s.precip_climate_mm, 0)}</td><td>${fmt(s.temp_mean_c, 1)}</td></tr>`).join('');
  drawDayChart(); renderDay();
}
function drawDayChart(){
  const days = D.climate.weather.days; const cv = $('dayChart'); cv.width = cv.clientWidth; const ctx = cv.getContext('2d'); const W = cv.width, H = cv.height; ctx.clearRect(0, 0, W, H);
  const n = days.length; const x = d => 4 + d * (W - 8) / n; const w = (W - 8) / n;
  const pm = Math.max(...days.map(d => d.precip_mm), 1); const ts = days.map(d => d.temp_c); const tmin = Math.min(...ts), tmax = Math.max(...ts);
  for (let d = 0; d < n; d++) { ctx.fillStyle = TYPE_COLORS[days[d].type] || '#888'; ctx.fillRect(x(d), H - 22, Math.ceil(w), 14); }
  ctx.fillStyle = 'rgba(59,111,182,.7)'; for (let d = 0; d < n; d++) { const bh = days[d].precip_mm / pm * (H - 60); ctx.fillRect(x(d), H - 24 - bh, Math.ceil(w), bh); }
  ctx.strokeStyle = '#c44e52'; ctx.lineWidth = 1.2; ctx.beginPath(); for (let d = 0; d < n; d++) { const y = 6 + (1 - (ts[d] - tmin) / Math.max(1e-6, tmax - tmin)) * (H - 70); d ? ctx.lineTo(x(d) + w / 2, y) : ctx.moveTo(x(d) + w / 2, y); } ctx.stroke();
  const C = D.climate; const dps = C.calendar.days_per_season; ctx.fillStyle = '#8a94a6'; ctx.font = '11px sans-serif'; ctx.textAlign = 'center';
  for (let s = 0; s < C.seasons.length; s++) { ctx.fillRect(x(s * dps), 0, 1, H - 22); ctx.fillText(C.season_names[s], x((s + 0.5) * dps), H - 2); }
  ctx.fillStyle = '#e6e9ef'; ctx.textAlign = 'left'; ctx.fillText(`${fmt(tmax, 0)}°`, 4, 12); ctx.fillText(`${fmt(tmin, 0)}°`, 4, H - 44);
  // 当前日游标
  ctx.fillStyle = '#f0b35a'; ctx.fillRect(x(day), 0, 2, H - 8);
  cv.onclick = e => { day = Math.max(0, Math.min(n - 1, Math.floor((e.offsetX - 4) / (W - 8) * n))); $('daySl').value = day; renderDay(); if ($('baseSel').value === 'temp') { base = null; draw(); } };
}
function renderDay(){
  const days = D.climate.weather.days; const d = days[day]; if (!d) return; drawDayChart();
  if (dayTab && liveOn()) { if (!dayLayer || dayLayerDay !== day) buildDayLayer(day); const st = dayStats; const T = dayTab;
    const riverState = T.frozen[day] ? '结冰' : (T.flood[day] ? '<span style="color:#8fb8de">漫滩</span>' : (T.high[day] ? '涨水' : '平水'));
    $('dayState').innerHTML = `雪线 ${T.snowLine[day] > T.hmax ? '无雪' : fmt(T.snowLine[day], 0) + ' m'}${st ? `（积雪覆盖陆地 ${fmt(st.snowFrac * 100, 0)}%）` : ''} · 岸缘气温 ${fmt(T.Trim[day], 1)} °C · 土壤湿度 ${fmt(T.wet[day], 2)} · 植被 ${fmt(T.green[day], 2)} · 作物 ${['休耕', '出苗', '生长', '将熟', '待收'][Math.min(4, (T.crop[day] * 5) | 0)]} · 溪涧 ${T.flow[day] >= 0.5 ? '有水' : '<span style="color:#e0a060">断流</span>'} · 河 ${riverState}${d.type === '云海漫顶' ? ' · <span style="color:#e6e1f2">云海漫上岸缘 ' + fmt(T.fogH, 0) + ' m</span>' : ''}`;
  } else $('dayState').textContent = '';
  const C = D.climate; const arrow = '↓↙←↖↑↗→↘'[Math.round(d.wind_from_deg / 45) % 8];
  let ground = '';
  if (dayTab && liveOn() && dayStats) { const T = dayTab; const tags = []; if (dayStats.snowFrac >= 0.05) tags.push(`积雪 ${fmt(dayStats.snowFrac * 100, 0)}%`); if (T.frozen[day]) tags.push('河湖结冰'); if (T.flood[day]) tags.push('漫滩'); if (T.flow[day] < 0.5 && !T.frozen[day]) tags.push('溪涧断流'); if (tags.length) ground = ' <span class="small">地面：</span>' + tags.map(t => `<span class="pill" style="background:#2b3646">${t}</span>`).join(''); }
  $('dayCard').innerHTML = `<b>第 ${d.day} 日</b> · ${d.season_name} · ${d.month} 月 ${d.day_of_month} 日 <span class="small">天空：</span><span class="pill" style="background:${TYPE_COLORS[d.type]};color:#111">${d.type}</span> ${d.storm_event ? '<span class="pill">风暴 #' + d.storm_event + '</span>' : ''}${ground}
    <div>${isSnow(d.type) ? '降雪（水当量）' : '降水'} ${fmt(d.precip_mm, 1)} mm · 气温 ${fmt(d.temp_c, 1)} °C（峰顶）/ ${fmt(d.temp_rim_c ?? (dayTab ? dayTab.Trim[day] : d.temp_c), 1)} °C（岸缘）· 风 ${fmt(d.wind_ms, 1)} m/s 自 ${d.wind_from_deg}° ${arrow} · ${d.sailable ? '<span style="color:#9be0b6">可出航</span>' : '<span style="color:#f0a2a2">禁航</span>'}</div>
    <div class="small">季中气候：${C.seasons[d.season].name} 温 ${fmt(C.seasons[d.season].temp_c, 1)} °C，季雨 ${fmt(C.seasons[d.season].precip_mm, 0)} mm，风暴 ${fmt(C.seasons[d.season].storm, 2)}，窗口 ${fmt(C.seasons[d.season].window, 2)}</div>`;
}
load();
</script>
